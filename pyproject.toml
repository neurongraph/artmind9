[project]
name = "artmind9"
version = "0.5.0"
description = "A knowledge system that synchronizes with your mind using artificial intelligence - artmind"
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "claude-agent-sdk>=0.2.118",
    "click>=8.3.3",
    "docling>=2.92.0",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "jq>=1.6.0",
    "json-repair>=0.30.0",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "neo4j>=5.0.0",
    "ollama>=0.6.1",
    "openai>=1.50.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich-click>=1.9.8",
    "textual>=8.2.5",
    "uvicorn>=0.30.0",
]


[project.scripts]
artmind = "artmind._entry:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artmind", "utils"]
py-modules = ["paths"]

[tool.setuptools.package-data]
# Ship the agent skills, default domain schemas, and the .env template inside
# the wheel so a non-editable install can seed them into the run folder (~/.artmind).
artmind = ["skills/**/*", "domains/schemas/**/*", "opencode/**/*", "env.example"]
