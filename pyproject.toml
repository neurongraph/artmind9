[project]
name = "artmind9"
version = "0.10.0"
description = "A knowledge system that synchronizes with your mind using artificial intelligence - artmind"
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "claude-agent-sdk>=0.2.118",
    "click>=8.3.3",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "jq>=1.6.0",
    "json-repair>=0.30.0",
    "loguru>=0.7.3",
    "neo4j>=5.26.0",
    "networkx>=3.4",
    "ollama>=0.6.1",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich-click>=1.9.8",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# The document-ingest stack (docling ML conversion, markdown chunking, xlsx
# reading). Core installs omit it — query/serve/chat-ui/admin-ui and SQL
# querying all work without it. Hosts that ingest documents add it via:
#   uv tool install 'artmind9[ingest]'
# NB: `optional-dependencies` is the PEP 621 standard table name — it's what
# makes `artmind9[ingest]` resolve as a real installable extra; only the key
# (`ingest`) is ours to name.
ingest = [
    "docling>=2.145.0",
    "langchain-text-splitters>=1.1.2",
    "openpyxl>=3.1.0",
]


[project.scripts]
artmind = "artmind._entry:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Mirror the [ingest] extra so the hermetic suite still exercises the
    # chunking/xlsx paths (test_chunk_offsets.py etc.) without a workflow change.
    "docling>=2.145.0",
    "langchain-text-splitters>=1.1.2",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_domain_guard: run with the unknown-domain warning enabled (see test/conftest.py)",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["paths"]

# Discover subpackages rather than listing them: an explicit list silently dropped
# artmind.webui/traces/kg_views/... from the wheel (an editable install hides it).
# namespaces=false keeps asset-only dirs (skills/, domains/, opencode/) out of the
# package list; they ship as package-data below.
[tool.setuptools.packages.find]
include = ["artmind*", "utils*"]
namespaces = false

[tool.setuptools.package-data]
# Ship the agent skills, default domain schemas, and the .env template inside
# the wheel so a non-editable install can seed them into the run folder (~/.artmind).
# obsidian_plugin/ is the built Obsidian plugin, staged by `just obsidian-plugin-build`
# (a build output, gitignored): build the wheel through the justfile, or it ships without it.
artmind = ["skills/**/*", "domains/meta.yaml", "domains/schemas/**/*", "opencode/**/*", "env.example", "cli_guide_examples.json", "obsidian_plugin/*", "obsidian/*.yaml", "insights/aliases.yaml", "query_plan/*.yaml", "webui/static/**/*", "webui/templates/*"]
