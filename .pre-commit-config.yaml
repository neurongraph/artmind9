repos:
  - repo: local
    hooks:
      - id: generate-cli-guide
        name: Check artmind CLI guide is up to date
        entry: uv run python scripts/generate_cli_guide.py --check
        language: system
        pass_filenames: false
        files: ^(artmind/cli\.py|scripts/generate_cli_guide\.py|scripts/cli_guide_examples\.json|pyproject\.toml)$
