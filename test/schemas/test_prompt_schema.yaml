name: test_prompt
description: Minimal fixture exercising the structured entity_types format used by artmind.schema_reference.
subject: fixture domain analysis

entity_types:
  WIDGET:
    kind: recurrent
    description: A named widget produced by the fixture domain.
    type_examples: [small_widget, large_widget]
    properties:
      widget_id:
        hint: "e.g., W-001"
      color: {}
    relates_to:
      GADGET: [attached_to, compatible_with]
  GADGET:
    kind: recurrent
    description: A gadget that a widget can be attached to.
    type_examples: [basic_gadget, advanced_gadget]
    properties:
      gadget_id: {}
      capacity:
        hint: "max widgets it can hold"
