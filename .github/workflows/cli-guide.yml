name: Update CLI Guide

on:
  push:
    branches: [master, main]
    paths:
      - "artmind/cli.py"
      - "scripts/generate_cli_guide.py"
      - "scripts/cli_guide_examples.json"
      - "pyproject.toml"
  pull_request:
    paths:
      - "artmind/cli.py"
      - "scripts/generate_cli_guide.py"
      - "scripts/cli_guide_examples.json"
      - "pyproject.toml"

jobs:
  guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.21"

      - name: Regenerate CLI guide
        run: uv run python scripts/generate_cli_guide.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- docs/artmind-cli-guide.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated guide (push)
        if: github.event_name == 'push' && steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update artmind CLI guide"
          file_pattern: docs/artmind-cli-guide.html

      - name: Fail if guide is stale (PR)
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::CLI guide is stale. Run:'uv run python scripts/generate_cli_guide.py' locally and commit docs/artmind-cli-guide.html"
          git diff -- docs/artmind-cli-guide.html
          exit 1
