# Routing data for `artmind query plan`
# (spec docs/superpowers/specs/2026-10-22-query-plan-design.md §4.3).
#
# The one place routing lives. A route's `description` is what a decision model
# reads for that option, so it describes the QUESTION SHAPE, not the commands.
# Every route cites the evidence it came from: scenario (S<n>) and pattern (P<n>)
# ids in docs/query-routing-study/. Every template passes --compact; tests check
# each command and option against the Click tree.
# A trigger may start with `^`: it then matches only at the start of the question
# (after optional leading whitespace and punctuation), e.g. `^did we`.
version: 2
routes:
  - id: existence
    description: Whether something specific happened or is mentioned at all, or happened again (did I visit X again, any reference to X).
    triggers: ["^did i", "^did we", "any reference to", "any mention of", "ever", "again", "is there any", "was there any"]
    needs: [entity]
    steps:
      - "artmind query graph pattern7 --domain {domains} --searchTerm {entity_name} --shape brief --compact"
    fallbacks:
      - {when: zero_rows, cmd: "artmind query vector-text --shape brief --domain {domains} {question} --compact"}
    read: []
    evidence: [S25, P25]

  - id: enumeration
    description: A complete list of every recorded item of some kind (all the X, every Y, the recorded Z).
    triggers: ["all the", "every", "list all", "list the", "recorded", "complete list", "each of", "which ones"]
    needs: []
    steps:
      - "artmind query graph pattern7 --domain {domains} --searchTerm {keywords} --limit 50 --shape brief --compact"
    fallbacks:
      - {when: truncated, cmd: "artmind query graph pattern7 --domain {domains} --searchTerm {keywords} --limit 200 --shape brief --compact"}
    read: []
    evidence: [S24, P21]

  - id: aggregate
    description: A count, total, average or frequency over events or entities, when no saved query fits.
    triggers: ["how many", "how often", "number of", "count of", "total", "average", "sum of", "frequency"]
    needs: []
    steps:
      - "artmind query graph text2cypher --domain {domains} {question} --compact"
    fallbacks:
      - {when: zero_rows, cmd: "artmind query vector-text --shape brief --domain {domains} {question} --compact"}
    read: []
    evidence: [S3, P2]

  - id: superlative
    description: The favourite, most, least, top or best item of a kind; a ranking that has to be inferred, not a stored fact.
    triggers: ["favourite", "favorite", "the most", "the least", "top", "best", "worst", "biggest", "most often"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query insights list --domain {domains} --compact"}
      - {id: s2, run: "artmind query graph text2cypher --domain {domains} {question} --compact"}
    read: []
    evidence: [S22, P22]

  - id: entity_profile
    description: Who or what one specific person, place, organisation or thing is, and what is known about it.
    triggers: ["tell me about", "who is", "what is", "describe", "what do we know about", "profile of"]
    needs: [entity]
    steps:
      - "artmind query entity-context --domain {domains} --entityId {entity_id} --shape brief --compact"
    fallbacks:
      - {when: zero_rows, cmd: "artmind query vector-text --shape brief --domain {domains} {question} --compact"}
    read: []
    evidence: [S10]

  - id: entity_history
    description: How what is known about one entity changed over time, including facts later corrected or removed.
    triggers: ["history of", "over time", "changed over", "evolved", "timeline of", "used to be"]
    needs: [entity]
    kind: history
    program:
      - {id: s1, run: "artmind query entity-history --domain {domains} --entityId {entity_id} --compact"}
    guards:
      - {on: s1, if: "rows == 0", then: escalate}
    read: [references/temporal.md]
    evidence: [S5, P5]

  - id: time_history
    description: Which version of a document applied on a date, or what an earlier, superseded version of a document said.
    triggers: ["as of {date}", "on {date}", "before {date}", "earlier version", "previous version", "which version", "used to say", "at the time", "in force"]
    needs: [document]
    kind: history
    program:
      - {id: s1, run: "artmind query graph pattern10 --domain {domains} --documentName {document} --includeHistory --compact"}
      - {id: s2, run: "artmind query document-history --domain {domains} --documentName {document} --compact"}
    guards:
      - {on: s1, if: "rows == 0", then: escalate}
    read: [references/temporal.md]
    evidence: [S14, S20, P12]

  # No command fetches a supersession notice by itself: the notice chunk is reached
  # through `vector-text` / `pattern10 --includeHistory` on the documents the conflicts list names.
  - id: conflicts
    description: Whether documents or sources disagree or contradict each other, or which of two versions applies.
    triggers: ["conflict", "conflicting", "contradict", "disagree", "inconsistent", "differ", "which applies", "which one applies", "discrepancy"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query graph conflicts --domain {domains} --status all --compact"}
      - {id: s2, run: "artmind query vector-text --shape brief --domain {domains} {question} --compact"}
    read: [references/conflicts.md]
    evidence: [S13, P13]

  - id: hierarchy
    description: Who or what sits under, above or within something in a chain (reports, departments, parts of a whole).
    triggers: ["reports to", "report to", "works under", "chain of", "hierarchy", "who manages", "manager of", "part of", "belongs to"]
    needs: [entity]
    kind: one_step
    program:
      - {id: s1, run: "artmind query graph hierarchy --domain {domains} --entityId {entity_id} --compact"}
      - {id: s2, run: "artmind query entity-context --domain {domains} --entityId {entity_id} --shape brief --compact", when: "s1.rows == 0"}
    read: [references/hierarchy.md]
    evidence: [S11]

  - id: path
    description: How two named people, places or things are related or connected to each other.
    triggers: ["related to", "connection between", "connected to", "relationship between", "link between", "how are", "know each other"]
    needs: [two_entities]
    kind: one_step
    program:
      - {id: s1, run: "artmind query graph pattern6 --domain {domains} --entityId1 {entity_id} --entityId2 {other_entity_id} --compact"}
      - {id: s2, run: "artmind query graph pattern5 --domain {domains} --entityClass1 {entity_class} --entityClass2 {other_entity_class} --entityId1 {entity_id} --entityId2 {other_entity_id} --mode shortest --compact", when: "s1.rows == 0"}
      - {id: s3, run: "artmind query vector-text --shape brief --domain {domains} {question} --compact", when: "s1.rows == 0"}
    guards:
      - {on: s3, if: "rows == 0", then: escalate}
    read: []
    evidence: [S12]

  - id: document
    description: What one named document says, or a summary of that document.
    triggers: ["summarise {document}", "summarize {document}", "what does {document} say", "{document}"]
    needs: [document]
    steps:
      - "artmind query graph pattern10 --domain {domains} --documentName {document} --compact"
    fallbacks:
      - {when: zero_rows, cmd: "artmind query graph pattern10 --domain {domains} --documentName {document} --includeHistory --compact"}
    read: []
    evidence: [S16]

  - id: inventory
    description: Which documents of some kind exist in a domain or corpus (what SOPs, which policies, what notes).
    triggers: ["what documents", "which documents", "what kinds of", "list the documents", "what are the main", "which policies", "what policies", "what sops"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query domains-overview --compact"}
      # Added only when the question names a class of the domain (placeholder {class}).
      - {id: s2, run: "artmind query graph pattern1 --domain {domains} --entityClass {class} --shape brief --compact", optional: true}
    read: []
    evidence: [S18, P8]

  - id: procedure
    description: How to do something, or the steps, checks and escalation drawn from several procedures, policies or guides.
    triggers: ["how do i", "how do we", "how to", "steps to", "procedure for", "process for", "what should", "what happens when", "what are the steps"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query vector-text --shape brief --domain {domains} {question} --topK 10 --compact"}
    guards:
      - {on: s1, if: "rows == 0", then: escalate}
    read: []
    evidence: [S19, P14]

  - id: structured
    description: Numbers held in structured tables (accounts, cases, customers), alone or joined with what policy says about them.
    triggers: ["how many customers", "per customer", "accounts", "balance", "in the table", "records in"]
    needs: [store]
    steps:
      - "artmind db bridge --domain {domains} --compact"
      - "artmind query text2sql --domain {domains} {question} --compact"
    # A `graph` kind (no aggregate or guidance wording) keeps the default steps.
    # The planner picks the variant for the store kind it computed (candidates.store_facts).
    variants:
      analytical:
        - "artmind query text2sql --domain {domains} {question} --compact"
      hybrid:
        - "artmind db bridge --domain {domains} --compact"
        - "artmind query text2sql --domain {domains} {question} --compact"
      records_plus_guidance:
        - "artmind db bridge --domain {domains} --compact"
        - "artmind query text2sql --domain {domains} {question} --compact"
        - "artmind query vector-text --shape brief --domain {domains} {question} --compact"
    fallbacks: []
    read: [references/structured-store.md]
    evidence: [S7, S8, S9, P15]

  - id: insights
    description: What changed recently, who or what matters most, or who the user lost touch with; patterns across the whole domain.
    triggers: ["what changed", "who matters", "lost touch", "trend", "lately", "recently", "insight", "patterns"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query insights list --domain {domains} --compact"}
    read: []
    evidence: [S6, P6]

  - id: filing
    description: Notes filed under a tag, a project or an area.
    # v1 deliberately lists filing metadata unfiltered: there is no tag/project/area placeholder.
    triggers: ["tagged", "filed under", "in project", "in the area", "tag:"]
    needs: []
    kind: one_step
    program:
      - {id: s1, run: "artmind query graph filing-listing --domain {domains} --compact"}
    read: []
    evidence: [S17]

  - id: survey
    description: What several documents say about one topic, compared or summarised across them; an overview that no single passage holds.
    triggers: ["across", "compare", "comparison of", "what do the", "what does each", "overview of", "different approaches", "how do the", "themes in",
      "survey", "various", "all the documents", "all the contracts", "all the policies", "all the agreements", "all the reports",
      "which documents", "the contracts say", "the policies", "the agreements", "the reports",
      "who is responsible for", "what are the obligations", "responsibilities of"]
    needs: []
    kind: chunks_cross_document
    program:
      - id: p
        par:
          - {id: needle, run: "artmind query vector-text --shape brief --domain {domains} --topK 10 {search_term} --compact"}
          - {id: wide, run: "artmind query survey --shape brief --domain {domains} {question} --compact"}
      - {id: u, pick: {from: p, how: union}, when: "not needle.score_drop >= NEEDLE_MARGIN"}
    guards:
      - {on: wide, if: "truncated", then: {page: {until: k, k: 50}}}
      - {on: u, if: "distinct_documents == 0", then: escalate}
    read: []
    evidence: [S2, P43]

  - id: search
    description: Any other factual question, answered from the text of the documents.
    triggers: []
    needs: []
    programs:
      - kind: chunks_cross_document
        when: "chunks_only"
        program:
          - id: p
            par:
              - {id: needle, run: "artmind query vector-text --shape brief --domain {domains} --topK 10 {search_term} --compact"}
              - {id: wide, run: "artmind query survey --shape brief --domain {domains} {question} --compact"}
          - {id: u, pick: {from: p, how: union}, when: "not needle.score_drop >= NEEDLE_MARGIN"}
        guards:
          - {on: wide, if: "truncated", then: {page: {until: k, k: 50}}}
          - {on: u, if: "distinct_documents == 0", then: escalate}
      - kind: one_step
        program:
          - {id: s1, run: "artmind query vector-text --shape brief --domain {domains} {question} --compact"}
    read: []
    evidence: [S2, P43]
