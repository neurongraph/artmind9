# Intent cues for `query plan` (spec 2026-11-05 planner v2, section 3). Same trigger syntax as
# routes.yaml: `^` anchors a cue to the start of the message. `retrieve` has none: it is the
# default. A description is what a decision model reads, so it describes the message shape.
version: 1

intents:
  - id: retrieve
    description: A question about the corpus that needs documents, entities or facts looked up.
    triggers: []

  - id: follow_up_format
    description: A request to reshape or shorten the previous answer (table, list, shorter, add dates) with no new lookup.
    triggers:
      - make that a table
      - make it a table
      - ^shorter
      - ^longer
      - add the dates
      - as a list
      - as a table
      - ^format

  - id: follow_up_why
    description: A challenge or probe of the previous answer (why something was missed, are you sure, what about X) that re-runs the lookup.
    triggers:
      - why did you miss
      - why didn't you
      - are you sure
      - ^what about
      - ^and what about
      - you missed

  - id: curate
    description: A correction or curation instruction about entities or earlier results (these are the same, that is wrong, dismiss, merge).
    triggers:
      - are the same
      - is wrong
      - ^dismiss
      - ^merge
      - should be merged
      - same-as
      - ^approve
      - ^reject
      - ^adjudicate
      - open conflicts
      - open same-as
      - good with dismissing
      - be dismissed
      - ^dismissing
      - are two distinct
      - are distinct
      - all these are
      - are really the same
      - artmind curate
      - dismiss that
      - dismiss it
      - dismiss them

  - id: update
    description: An instruction to store a new fact or note in the knowledge base.
    triggers:
      - remember that
      - add this fact
      - note that

  - id: meta
    description: A question about the assistant itself, its model or its abilities, not about the corpus.
    triggers:
      - which model
      - model are you
      - are you using
      - what can you do
      - who are you

  - id: status
    description: A question about the progress or outcome of a running or finished background job.
    triggers:
      - ^done
      - ^status
      - the status
      - is it done
      - how far along
      - how far is the
      - how far is it
      - still running
      - ^progress
      - any progress
      - ingest done
      - ingest finished
      - ingest complete

  - id: ops
    description: An instruction to run a pipeline operation such as ingesting, re-extracting or rebuilding.
    triggers:
      - ^ingest
      - re-extract
      - reingest
      - ^rebuild
      - run the synthesize
      - run synthesize
      - run the projection
      - projection rebuild
      - vault sync
      - run the ingest
      - run ingest

# Cues of an instruction to the assistant (write a file, change a setting, add a column, "just a test").
# A lookup plan whose message carries one is capped below the threshold (planner.INSTRUCTION_CAP); the
# intent itself is not changed.
instructions:
  - into a file
  - to a file
  - as a file
  - save this
  - save that
  - save it
  - as a topic
  - write the table
  - write it to
  - the parameter
  - the setting
  - increase the
  - decrease the
  - don't do anything
  - do not do anything
  - just a test
  - add a column
  - add a description column
  - remove the column
  - create a table

affirmatives:
  - "yes"
  - "ok"
  - "okay"
  - "go on"
  - "do it"
  - "please"
  - "sure"
  - "go ahead"
  - "continue"
  - "yep"
  - "y"
  - "proceed"
  - "run it"
  - "sounds good"
  - "looks good"
