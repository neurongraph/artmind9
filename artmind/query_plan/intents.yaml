# Intent cues for `query plan` (spec 2026-11-05 planner v2, section 3). Same trigger syntax as
# routes.yaml: `^` anchors a cue to the start of the message. `retrieve` has none: it is the
# default. A description is what a decision model reads, so it describes the message shape.
version: 1

intents:
  - id: retrieve
    description: A question about the corpus that needs documents, entities or facts looked up.
    triggers: []

  - id: follow_up_format
    description: A request to reshape or shorten the previous answer (table, list, shorter, add dates) with no new lookup.
    triggers:
      - make that a table
      - make it a table
      - ^shorter
      - ^longer
      - add the dates
      - as a list
      - as a table
      - ^format

  - id: follow_up_why
    description: A challenge or probe of the previous answer (why something was missed, are you sure, what about X) that re-runs the lookup.
    triggers:
      - why did you miss
      - why didn't you
      - are you sure
      - what about
      - you missed

  - id: curate
    description: A correction or curation instruction about entities or earlier results (these are the same, that is wrong, dismiss, merge).
    triggers:
      - are the same
      - is wrong
      - dismiss
      - merge

  - id: update
    description: An instruction to store a new fact or note in the knowledge base.
    triggers:
      - remember that
      - add this fact
      - note that

  - id: meta
    description: A question about the assistant itself, its model or its abilities, not about the corpus.
    triggers:
      - which model
      - what can you do
      - who are you

  - id: status
    description: A question about the progress or outcome of a running or finished background job.
    triggers:
      - ^done
      - ^status
      - is it done
      - how far
      - still running
      - progress

  - id: ops
    description: An instruction to run a pipeline operation such as ingesting, re-extracting or rebuilding.
    triggers:
      - ^ingest
      - re-extract
      - reingest
      - rebuild

affirmatives:
  - "yes"
  - "ok"
  - "okay"
  - "go on"
  - "do it"
  - "please"
  - "sure"
  - "go ahead"
  - "continue"
  - "yep"
  - "y"
