name: personal_journal
description: Personal diary entries, journals, and daily logs that record events, reflections, interactions,
  emotions, and plans over time. Typically written in first person, covering family life, work, social
  encounters, and inner thoughts.
subject: personal journal analysis
persona: a perceptive reader of personal journals
temporal:
  document:
    valid_from:
    - Date
    - date
  relative_anchor: document.valid_from
  defaults:
    valid_from: ingestion_date
    valid_to: null
    superseded_by: null
    time_source: default_ingestion
    valid_from_inferred: true
entity_types:
  PERSON:
    kind: recurrent
    description: Any individual named or meaningfully described in the entry — family members, colleagues,
      friends, service providers, or the diarist themselves. Include people who are merely mentioned or
      discussed.
    type_examples:
    - self
    - spouse
    - child
    - parent
    - sibling
    - friend
    - colleague
    - professional
    - pet
    - acquaintance
    properties:
      relationship_to_diarist:
        hint: e.g., "wife", "son", "colleague"
      current_state:
        hint: health, mood, life situation as mentioned
      recurring_behaviours:
        hint: patterns evident across entries
      notable_characteristics:
        hint: distinguishing qualities
      personality_traits:
        hint: list — as revealed in this entry
      age_or_life_stage:
        hint: if mentioned
      occupation_or_school_year:
        hint: if relevant
    relates_to:
      PERSON:
      - related_to
      - married_to
      - parent_of
      - child_of
      - friend_of
      - colleague_of
      - cares_for
      - worries_about
      - conflicts_with
      - mentors
      - supports
      - spends_time_with
      - is_proud_of
      - is_concerned_about
      - looks_after
      LOCATION:
      - lives_at
      - works_at
      - studies_at
      - visits
      - commutes_to
      - frequents
      - walks_to
      - went_to
      - picks_up_from
      EVENT:
      - 'participates_in (properties: {role: organiser|participant|observer|subject})'
      - causes
      - witnesses
      - is_affected_by
      - mentions
      - prepares_for
      ACTIVITY:
      - performs
      - enjoys
      - dislikes
      - started
      - resumed
      - does_regularly
      - has_been_assigned
      - helps_with
      EMOTION:
      - experiences
      - expresses
      - triggers_in
      - suppresses
      - resolves
      PLAN:
      - has_plan
      - intends
      - needs_to
      - scheduled_for
      - discussed_with
      OBJECT:
      - owns
      - uses
      - gifts
      - receives
      - loses
      - finds
      - mentions
      ORGANIZATION:
      - works_at
      - attends
      - member_of
      - visited
      - associated_with
      - left
      - joined
  LOCATION:
    kind: recurrent
    description: Any location mentioned or visited — rooms, buildings, neighbourhoods, cities, or institutions.
      Include places only referenced in plans or memories.
    type_examples:
    - home
    - workplace
    - school
    - restaurant
    - park
    - hospital
    - shop
    - neighbourhood
    - city
    - transit
    properties:
      place_type:
        hint: home, school, park, restaurant, etc.
      atmosphere:
        hint: how it feels when mentioned
      frequency_of_visit:
        hint: daily, occasional, first-time
      who_associated_with:
        hint: which people are linked to this place
      location:
        hint: city, neighbourhood if mentioned
      narrative_function:
        hint: why it matters in this entry
  EVENT:
    kind: occurrent
    description: Any significant occurrence, happening, or episode described in the entry. Not routine
      background actions — only those with emotional, social, or practical weight.
    type_examples:
    - celebration
    - conflict
    - achievement
    - appointment
    - visit
    - outing
    - work_event
    - social_gathering
    - routine_disruption
    - health_incident
    - conversation
    - milestone
    properties:
      date_or_time:
        temporal: event_at
      participants:
        hint: list with roles
      outcome:
        hint: what happened, was it positive/negative/neutral
      emotional_significance:
        hint: how it affected the diarist
      cause:
        hint: what triggered it
      is_recurring:
        hint: one-off or part of a pattern
    relates_to:
      LOCATION:
      - occurs_at
      EMOTION:
      - evokes
      - results_in
      - intensifies
      - relieves
      PLAN:
      - prompted_by
      - leads_to
      - linked_to
      OBJECT:
      - involves
      - uses
      - concerns
      ORGANIZATION:
      - held_at
      - organised_by
      - involves
  ACTIVITY:
    kind: recurrent
    description: A recurring or single purposeful activity, task, or pursuit described in the entry. Distinct
      from one-off events — activities are things people do regularly or invest deliberate effort in.
    type_examples:
    - domestic
    - exercise
    - work
    - study
    - creative
    - social
    - care
    - leisure
    - commute
    - errand
    properties:
      who_involved:
        hint: list
      frequency:
        hint: daily, occasional, new
      purpose:
        hint: relaxation, duty, health, social
      emotional_valence:
        hint: enjoyed, dreaded, routine
      outcome_or_result:
        hint: if mentioned
      date_or_time:
        temporal: event_at
    relates_to:
      LOCATION:
      - takes_place_at
      - associated_with
  EMOTION:
    kind: recurrent
    description: A feeling, mood, or emotional state experienced or observed in the entry. Extract as
      a named entity when it is explicitly described or strongly implied, and has significance to the
      narrative.
    type_examples:
    - joy
    - pride
    - anxiety
    - exhaustion
    - relief
    - frustration
    - love
    - sadness
    - excitement
    - contentment
    - guilt
    - worry
    properties:
      experienced_by:
        hint: who feels it
      trigger:
        hint: what caused it
      intensity:
        hint: mild, moderate, strong
      resolution:
        hint: did it pass, was it addressed
      duration:
        hint: momentary, lingering
  PLAN:
    kind: recurrent
    description: Any stated intention, goal, task, or future arrangement mentioned in the entry. Includes
      both firm plans and tentative thoughts about what needs to happen.
    type_examples:
    - family
    - work
    - health
    - social
    - errand
    - long_term
    - resolution
    - reminder
    properties:
      timeframe:
        hint: today, this week, vague future
      who_involved: {}
      motivation:
        hint: why this plan matters
      status:
        hint: firm intention, tentative, wishful
      urgency: {}
    relates_to:
      PERSON:
      - involves
      - assigned_to
      - discussed_with
  OBJECT:
    kind: recurrent
    description: Any physical item, possession, or tangible thing that plays a role in the journal entry
      — gifts, household items, vehicles, or objects with emotional significance.
    type_examples:
    - gift
    - vehicle
    - household_item
    - food
    - document
    - clothing
    - possession
    - device
    properties:
      what_it_is:
        hint: brief description
      who_owns_or_uses_it: {}
      emotional_significance:
        hint: if any
      narrative_role:
        hint: why it matters in this entry
  ORGANIZATION:
    kind: recurrent
    description: Any formal or informal group, institution, company, or collective mentioned in the journal
      entry.
    type_examples:
    - employer
    - school
    - club
    - community_group
    - government
    - healthcare
    - business
    - religious_group
    properties:
      org_type:
        hint: employer | school | healthcare | etc.
      relationship_to_writer:
        hint: works_at | member_of | attended | etc.
      sentiment:
        hint: positive | negative | neutral | mixed
      frequency_of_mention:
        hint: if notable
  STATE_CHANGE:
    kind: occurrent
    description: A change in an entity's state, status, or relationship over time — extract when an entry
      records that something became different from before (a mood shift, a relationship change, a plan
      starting or ending). Carry the date it happened.
    type_examples:
    - mood_shift
    - relationship_change
    - plan_started
    - plan_ended
    - status_change
    properties:
      what_changed:
        hint: the entity or relationship affected
      from_state: {}
      to_state: {}
      date_or_time:
        hint: when the change occurred — anchored to the entry date if relative
        temporal: event_at
    relates_to:
      PERSON:
      - state_of
      - affects
      - involves
      EVENT:
      - triggered_by
      - resulted_from
