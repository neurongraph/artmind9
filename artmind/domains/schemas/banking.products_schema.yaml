name: banking.products
description: Product terms & conditions, pricing guides, and customer FAQs for FirstUK Bank retail banking
  products — covering savings accounts, current accounts, mortgages, and debit cards with their interest
  rates, fees, eligibility rules, and contractual provisions.
subject: banking product documentation analysis
persona: a banking product analyst
temporal:
  document:
    valid_from:
    - Effective Date
    - Issued Date
    - Last Updated
    version:
    - Version
  relative_anchor: document.valid_from
  defaults:
    valid_from: ingestion_date
    valid_to: null
    superseded_by: null
    time_source: default_ingestion
    valid_from_inferred: true
guidance:
  relationships: |-
    PRODUCT → RATE TIER IS CORE: for pricing documents, the most important structure is PRODUCT has_rate_tier INTEREST_RATE_TIER, PRODUCT charges_fee FEE. Always capture the full set of tier and fee relationships for each product.
    All PRODUCT → INTEREST_RATE_TIER rate tier relationships captured (one per tier).
    All PRODUCT → FEE relationships captured.
    All PRODUCT → ELIGIBILITY_RULE requirements captured.
    All PRODUCT → TERMS_CLAUSE governing provisions captured.
    FAQ_ITEM → INTEREST_RATE_TIER or FEE explanation links captured.
entity_types:
  PRODUCT:
    kind: recurrent
    description: 'A distinct banking product or sub-product offered by FirstUK Bank to customers. Each
      named product variant (SmartSaver Account, SmartSaver Plus, Current Account, Mortgage) is a separate
      entity. Include both the product name and its product_id code when stated. Note: payment cards are
      extracted as CARD entities, not PRODUCT. Joint account arrangements are extracted as JOINT_ACCOUNT
      entities, not PRODUCT.'
    type_examples:
    - savings_account
    - premium_savings
    - current_account
    - mortgage
    - isa
    - business_account
    properties:
      product_id:
        hint: e.g., SAV-001
      product_type:
        hint: savings | current | mortgage | card
      target_customer:
        hint: who it is designed for
      minimum_opening_balance:
        hint: £ amount
      maximum_balance:
        hint: £ amount or "unlimited"
      overdraft_available:
        hint: yes/no and terms
      monthly_fee:
        hint: £ amount
      interest_rate_type:
        hint: fixed | variable | tiered_variable
      interest_payment_frequency:
        hint: monthly | annual
      available_channels:
        hint: branch | online | mobile | postal
      regulatory_protections:
        hint: e.g., FSCS up to £85,000
      competitive_positioning:
        hint: how it compares to market
      effective_date:
        hint: when current terms became effective
        temporal: valid_from
    relates_to:
      PRODUCT:
      - upgrades_to
      - includes_as_variant
      - competes_with
      - shares_pricing_with
      - converts_to
      PRODUCT_FEATURE:
      - has_feature
      - excludes_feature
      - offers_as_premium
      - bundles
      INTEREST_RATE_TIER:
      - has_rate_tier
      - earns_at_rate
      - charges_rate (for overdraft/mortgage)
      FEE:
      - charges_fee
      - waives_fee
      - applies_fee_for
      ELIGIBILITY_RULE:
      - requires
      - governs_via
      - restricts_to
      TERMS_CLAUSE:
      - governed_by
      - includes_term
      - subject_to
      FAQ_ITEM:
      - addressed_by
      - explained_in
  PRODUCT_FEATURE:
    kind: recurrent
    description: A specific capability, service, or entitlement included in a product — something that
      describes what the customer can do with or through the product. Capture features that differentiate
      products or are customer-facing benefits, not internal mechanics.
    type_examples:
    - access_feature
    - payment_feature
    - channel_feature
    - service_feature
    - security_feature
    - premium_service
    - protection_scheme
    properties:
      feature_description:
        hint: what the customer can do
      available_in_products:
        hint: which products include this
      conditions:
        hint: any conditions on using the feature
      channel:
        hint: online | branch | ATM | app
      limits:
        hint: e.g., ATM daily limit £500
      cost:
        hint: free or fees apply
  INTEREST_RATE_TIER:
    kind: recurrent
    description: A specific interest rate applied to a defined balance range or product variant. Capture
      both the rate value and the balance threshold together as a single entity. Include both AER and
      gross rates when both are stated.
    type_examples:
    - savings_rate
    - tiered_rate
    - fixed_mortgage_rate
    - variable_mortgage_rate
    - overdraft_rate
    - penalty_rate
    properties:
      rate_value:
        hint: percentage, e.g., 4.50
      rate_format:
        hint: AER | Gross | APR
      balance_min:
        hint: numeric, no currency symbol or thousands separators, e.g., 10001
      balance_max:
        hint: numeric, no currency symbol or thousands separators, e.g., 50000; the
          string "unlimited" if the tier has no upper bound
      rate_type:
        hint: fixed | variable | tiered_variable
      rate_basis:
        hint: the variation formula only, e.g., "BoE Base Rate + 2.50% margin". Not the
          rate type ("Variable") and not the quoting basis ("AER") -- those are rate_format.
      review_frequency:
        hint: how often rate is reviewed
      effective_date:
        hint: when this rate took effect
        temporal: valid_from
      example_calculation:
        hint: example as shown in document
      product_id:
        hint: which product this rate applies to
    relates_to:
      INTEREST_RATE_TIER:
      - higher_balance_than
      - adjacent_tier_to
      TERMS_CLAUSE:
      - governed_by (rate change mechanism)
      - calculated_per (interest calculation rule)
    guidance: |-
      INTEREST_RATE_TIER entities include rate_value, balance_min, balance_max, rate_basis.
      Each tier is its own entity -- never a single entity per product covering all tiers.
      Naming: identify the TIER, never its current rate. The rate and the balance range go in
      properties -- the rate is revised every month, and a name carrying it cannot be matched
      to the same tier in the next schedule. The tier ordinal IS identity and stays.
        RIGHT:   { "name": "SmartSaver Tier 1 Rate", "rate_value": 4.50, "balance_min": "£0", "balance_max": "£10,000" }
        WRONG:   { "name": "SmartSaver Tier 1 Rate -- 4.50% AER (£0-£10,000)" }
  FEE:
    kind: recurrent
    description: A specific charge levied on the customer for a transaction type, service, or event. Capture
      the fee name, amount, and the triggering condition as a single entity. Include £0 fees only when
      they are explicitly called out as a feature (e.g., "no monthly fee").
    type_examples:
    - transaction_fee
    - card_fee
    - service_fee
    - penalty_fee
    - overdraft_fee
    - maintenance_fee
    - closure_fee
    properties:
      fee_amount:
        hint: £ value or "free"
      trigger_event:
        hint: what causes this fee
      frequency:
        hint: one-time | per_transaction | monthly | annual
      applies_to_products:
        hint: list
      conditions:
        hint: any conditions that apply or waive the fee
      comparison_note:
        hint: if document compares to competitors
    relates_to:
      PRODUCT_FEATURE:
      - charged_for
      - waived_for
      - enables
    guidance: |-
      FEE entities include fee_amount and trigger_event.
      Capture £0 fees too when explicitly called out as a feature (e.g. "no monthly fee").
  ELIGIBILITY_RULE:
    kind: recurrent
    description: A condition that a customer must satisfy to open, hold, or access a product. Include
      identity, residency, age, and balance requirements. These define who the product is for.
    type_examples:
    - age_requirement
    - residency_requirement
    - identity_requirement
    - balance_requirement
    - credit_requirement
    - account_type_requirement
    properties:
      rule_description:
        hint: the requirement in plain language
      rule_type:
        hint: mandatory | conditional
      applies_to_products:
        hint: list
      verification_method:
        hint: how the bank checks this
      exception:
        hint: any stated exceptions
      consequence_of_failure:
        hint: what happens if not met
    relates_to:
      PRODUCT_FEATURE:
      - gates_access_to
      - verified_via
      TERMS_CLAUSE:
      - enforced_by
      - referenced_in
  TERMS_CLAUSE:
    kind: recurrent
    description: A specific contractual provision that governs the rights, obligations, or procedures
      between the customer and the bank under the product. This includes liability rules, dispute resolution,
      fraud protections, dormancy policies, data rights, and change-of-terms provisions. Each distinct
      clause is a separate entity.
    type_examples:
    - liability_clause
    - fraud_protection
    - closure_rule
    - joint_account_provision
    - data_protection_right
    - dormancy_policy
    - change_of_terms
    - interest_calculation_rule
    - direct_debit_guarantee
    - regulatory_protection
    properties:
      clause_summary:
        hint: the provision in plain language
      customer_rights:
        hint: what the customer is entitled to
      bank_obligations:
        hint: what the bank must do
      customer_obligations:
        hint: what the customer must do
      time_limits:
        hint: any deadlines stated, e.g., "within 10 business days"
      applies_to_products:
        hint: list
      regulatory_basis:
        hint: which regulation drives this, if stated
      exception_or_caveat:
        hint: any stated exceptions
    relates_to:
      TERMS_CLAUSE:
      - supersedes
      - relates_to
      - modifies
      - exception_to
    guidance: TERMS_CLAUSE entities include time_limits when stated.
  FAQ_ITEM:
    kind: recurrent
    description: A customer question and its official answer as a paired unit. Capture the question topic
      and key answer points together. Extract FAQ items that convey policy decisions, product rules, or
      useful customer guidance not otherwise captured in the above classes.
    type_examples:
    - account_basics
    - interest_query
    - fees_query
    - access_query
    - security_query
    - process_query
    - eligibility_query
    - dispute_query
    properties:
      question:
        hint: the customer question as asked
      answer_summary:
        hint: key points of the official answer
      products_covered:
        hint: which products the Q&A applies to
      related_policy:
        hint: if the answer references a specific rule or policy
      customer_action:
        hint: what the customer should do based on the answer
      urgency:
        hint: routine | important | time_sensitive
    relates_to:
      INTEREST_RATE_TIER:
      - explains
      - references
      - clarifies
      FEE:
      - explains
      - references
      TERMS_CLAUSE:
      - clarifies
      - summarises
      ELIGIBILITY_RULE:
      - explains
      - clarifies
      PRODUCT_FEATURE:
      - explains
      - references
  ACCOUNT:
    kind: recurrent
    description: A customer account opened, held, modified, or closed under a banking product — savings,
      current, or joint. Extract when the document defines rules, state, or events that apply to the account
      itself.
    type_examples:
    - savings_account
    - current_account
    - joint_account
    - new_account
    - dormant_account
    - frozen_account
    - closed_account
    properties:
      account_type:
        hint: savings | current | joint
      account_state:
        hint: new | active | dormant | frozen | closed
      balance_minimum:
        hint: numeric, no currency symbol or thousands separators, e.g., 500; the
          string "none" if the account has no stated minimum
      balance_maximum:
        hint: numeric, no currency symbol or thousands separators, e.g., 50000; the
          string "unlimited" if the account has no stated maximum
      dormancy_threshold:
        hint: how long with no activity before the account is classified dormant,
          e.g., "12 months"
      closure_or_freeze_conditions: {}
    relates_to:
      PRODUCT:
      - opened_under
      - governed_by
      - linked_to
      TERMS_CLAUSE:
      - subject_to
      - governed_by
      INTEREST_RATE_TIER:
      - earns_at
      - subject_to
      ACCOUNT_HOLDER:
      - has_holder
      - held_by
      CARD:
      - linked_to
      - issues
      JOINT_ACCOUNT:
      - classified_as
      - structured_as
      TRANSACTION:
      - records
      - generates
      - has_associated
      KYC_VERIFICATION:
      - gate_for_opening
      - required_before_activating
      AML_SCREENING:
      - required_before_opening
      - ongoing_monitoring_of
      FRAUD_ALERT:
      - raised_on
      - results_in_freeze_of
      STANDING_ORDER:
      - set_up_on
      - deducts_from
      DIRECT_DEBIT:
      - set_up_on
      - deducts_from
  ACCOUNT_HOLDER:
    kind: recurrent
    description: A person with legal rights and obligations over an account — primary, joint, or secondary
      holder — including their liability, authority, and due-diligence obligations.
    type_examples:
    - primary_holder
    - joint_holder
    - secondary_holder
    - beneficial_owner
    - signatory
    properties:
      holder_type:
        hint: primary | joint | secondary
      liability_scope: {}
      withdrawal_or_signing_authority: {}
      due_diligence_requirement: {}
    relates_to:
      TERMS_CLAUSE:
      - governed_by
      - subject_to
      JOINT_ACCOUNT:
      - party_to
      - has_rights_in
      - liable_under
  AML_SCREENING:
    kind: recurrent
    description: Anti-Money Laundering screening — sanctions/PEP list checks, transaction monitoring,
      or ongoing screening — as mandated, executed, or reviewed by the document.
    type_examples:
    - sanctions_screening
    - pep_screening
    - transaction_monitoring
    - ongoing_monitoring
    - adverse_media_check
    properties:
      mandatory:
        hint: yes/no
      screening_lists_or_scope: {}
      hit_or_match_response: {}
      regulatory_basis: {}
    relates_to:
      TRANSACTION:
      - monitors
      - screens_for_patterns_in
      SAR:
      - triggers
      - leads_to_filing_of
  CARD:
    kind: recurrent
    description: A payment card issued to, or referenced in connection with, a customer account — its
      issuance, use, blocking, or replacement.
    type_examples:
    - debit_card
    - credit_card
    - prepaid
    - contactless
    - replacement_card
    - card_fraud_scenario
    properties:
      card_type:
        hint: debit | credit | prepaid
      card_state:
        hint: issuance | active | blocked | replacement
      block_or_replacement_conditions: {}
      daily_or_contactless_limit: {}
    relates_to:
      PRODUCT:
      - issued_with
      - linked_to
      FEE:
      - incurs_fee_for (replacement, foreign transaction)
      TERMS_CLAUSE:
      - governed_by
  CUSTOMER:
    kind: recurrent
    description: A natural person who holds, applies for, or is otherwise the subject of a banking relationship
      — an account, product, transaction, or compliance process. Extract as a first-class entity whenever
      the customer is a defined party in the document, not merely mentioned in passing.
    type_examples:
    - individual_customer
    - joint_account_holder
    - new_customer
    - existing_customer
    - high_risk_customer
    - pep_customer
    - applicant
    - prospective_customer
    properties:
      customer_type:
        hint: individual | joint_applicant | existing | new | high_risk | pep
      risk_classification:
        hint: standard | high_risk | pep | sanctioned
      eligibility_or_verification_status:
        hint: as stated in this document
      context_role:
        hint: how this customer appears in this document
    relates_to:
      PRODUCT:
      - applies_for
      - holds
      - eligible_for
      - excluded_from
      ELIGIBILITY_RULE:
      - subject_to
      - must_satisfy
      - governs_access_for
      ACCOUNT:
      - holds
      - opens
      - closes
      - liable_for
      ACCOUNT_HOLDER:
      - designated_as
      - has_role_as
      AML_SCREENING:
      - screened_by
      - applied_to
      - required_for
      KYC_VERIFICATION:
      - required_to_complete
      - verified_by
      - subject_to
      SAR:
      - filed_about
      - concerns
      JOINT_ACCOUNT:
      - held_jointly_by
      - requires_consent_of_both
      STANDING_ORDER:
      - initiated_by
      - belongs_to
      DIRECT_DEBIT:
      - authorised_by
      - belongs_to
  DIRECT_DEBIT:
    kind: recurrent
    description: A direct debit mandate on a customer account — its setup, the Direct Debit Guarantee,
      amendment, cancellation, or dispute.
    type_examples:
    - dd_mandate_setup
    - dd_guarantee
    - dd_cancellation
    - dd_dispute
    - indemnity_claim
    properties:
      mandate_process: {}
      dd_guarantee_coverage: {}
      cancellation_or_dispute_process: {}
  FRAUD_ALERT:
    kind: recurrent
    description: A fraud detection alert or fraud response — its generation, investigation, escalation,
      or the customer-facing action it triggers.
    type_examples:
    - fraud_detection_obligation
    - card_fraud_event
    - account_takeover
    - fraud_investigation
    - customer_reimbursement
    properties:
      generation_trigger: {}
      investigation_or_escalation_path: {}
      customer_notification: {}
      reimbursement_obligation: {}
    relates_to:
      CARD:
      - raised_for
      - protects
      TRANSACTION:
      - triggered_by
      - raised_on
  JOINT_ACCOUNT:
    kind: recurrent
    description: An account arrangement held jointly by two or more customers with shared rights, liabilities,
      and consent requirements.
    type_examples:
    - joint_and_several
    - tenants_in_common
    - joint_account_arrangement
    properties:
      liability_type:
        hint: joint_and_several | tenants_in_common
      consent_requirements: {}
      dual_kyc_or_aml_requirement: {}
      closure_consent: {}
    relates_to:
      TERMS_CLAUSE:
      - governed_by
      - subject_to
      ELIGIBILITY_RULE:
      - subject_to
      - both_holders_must_satisfy
  KYC_VERIFICATION:
    kind: recurrent
    description: The Know Your Customer identity/address verification process — as a compliance obligation,
      an operational procedure, or an audited control. Extract when the document defines, executes, or
      evaluates KYC requirements.
    type_examples:
    - identity_verification
    - address_verification
    - enhanced_due_diligence
    - periodic_refresh
    - document_collection
    properties:
      mandatory:
        hint: yes/no
      timing_or_refresh_frequency: {}
      verification_method: {}
      consequence_of_failure: {}
    relates_to:
      ELIGIBILITY_RULE:
      - implements
      - required_by
      - satisfies
      PRODUCT:
      - required_for
      - gates_access_to
      JOINT_ACCOUNT:
      - required_for_both_holders_of
      - applied_to
  SAR:
    kind: occurrent
    description: A Suspicious Activity Report — the obligation, preparation, filing, or tracking of a
      SAR to the relevant authority (e.g. the NCA).
    type_examples:
    - sar_obligation
    - sar_filing_deadline
    - internal_sar
    - external_sar
    - sar_confidentiality
    properties:
      filing_obligation: {}
      filing_deadline: {}
      confidentiality_rule: {}
      consequence_of_non_filing: {}
    relates_to:
      TRANSACTION:
      - triggered_by
      - based_on_evidence_from
  STANDING_ORDER:
    kind: recurrent
    description: A standing order payment instruction on a customer account — its setup, amendment, cancellation,
      or failure handling.
    type_examples:
    - standing_order_setup
    - standing_order_amendment
    - standing_order_cancellation
    - payment_failure_handling
    properties:
      setup_or_amendment_process: {}
      beneficiary_validation: {}
      cancellation_process: {}
      failure_handling: {}
  TRANSACTION:
    kind: occurrent
    description: A financial event on a customer account — a deposit, withdrawal, transfer, payment, or
      fee charge — referenced because it is monitored, disputed, reported, or otherwise governed by the
      document.
    type_examples:
    - deposit
    - withdrawal
    - transfer
    - fee_charge
    - suspicious_transaction
    - high_value_transaction
    - disputed_transaction
    - monitored_transaction
    properties:
      transaction_type:
        hint: deposit | withdrawal | transfer | fee_charge | suspicious | disputed
      monitoring_or_reporting_obligation: {}
      threshold_value:
        hint: numeric, no currency symbol or thousands separators, e.g., 10000
      dispute_or_reversal_rules: {}
    relates_to:
      FEE:
      - triggers
      - incurs
      - subject_to
      TERMS_CLAUSE:
      - governed_by
      - subject_to
