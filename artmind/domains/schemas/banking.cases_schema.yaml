  EXTRACTION RULES:
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  1. EXPLICIT AND IMPLICIT
     Extract both directly stated relationships ("Operations finds 118 confirmed affected customers")
     and those clearly implied ("Retain and restrict" incident records → CASE requires RETENTION_DECISION).

  2. CONFLICTING ASSESSMENTS ARE AN EDGE, NOT A MERGE
     When two IMPACT_ASSESSMENT entities give different counts for the same case, link them with
     conflicts_with or pending_reconciliation_with rather than discarding one. This is the single
     most important relationship in an incident case — it preserves the fact that reconciliation
     is unresolved.

  3. MULTIPLE EDGES ALLOWED
     Create a separate edge for each distinct relationship between two entities — a case can have
     many events, several remediation actions, and more than one impact assessment.

  4. PROPERTIES MAP
     The properties object is flexible and rel_type-specific. Examples:

     For "conflicts_with": { count_a: integer, count_b: integer, reconciliation_status: string }
     For "gated_by": { blocking: boolean, reason: string }
     For "has_hold_under": { hold_status: string, review_date: string }

