name: banking.communications
description: Staff training materials and customer communication templates for FirstUK Bank — covering
  mandatory compliance training modules (AML, KYC, GDPR, fraud), product training, branch operations training,
  email/SMS templates, and call centre scripts.
subject: banking communications and training document analysis
persona: a training designer or communications manager
temporal:
  document:
    valid_from:
    - Effective Date
    - Issued Date
    - Reporting Date
    - Last Updated
    version:
    - Version
  relative_anchor: document.valid_from
  defaults:
    valid_from: ingestion_date
    valid_to: null
    superseded_by: null
    time_source: default_ingestion
    valid_from_inferred: true
entity_types:
  COMMUNICATION_TEMPLATE:
    kind: recurrent
    description: A named, reusable communication template — email, SMS, letter, or call centre script
      — designed for a specific trigger event or customer interaction. Capture the template's purpose,
      trigger condition, key structure, tone, and any embedded regulatory disclosures. Each named template
      is a separate entity.
    type_examples:
    - email_template
    - sms_template
    - call_script
    - letter_template
    - push_notification
    - promotional
    - service_notification
    - security_alert
    - fraud_alert
    - confirmation
    properties:
      document_id:
        hint: e.g., EMAIL-TEMPLATE-001
      trigger_event:
        hint: what event sends this template
      channel:
        hint: email | sms | call | letter
      subject_line:
        hint: email subject if stated
      recipient:
        hint: who receives this communication
      key_content:
        hint: list of main message components
      variables_used:
        hint: list of placeholder names used
      tone:
        hint: formal | friendly | urgent | regulatory
      compliance_disclosures:
        hint: any regulatory text that must be included
      owner:
        hint: team responsible for maintaining this template
      do_not_alter_sections:
        hint: parts that must not be changed
      effective_date:
        temporal: valid_from
    relates_to:
      TEMPLATE_VARIABLE:
      - contains
      - requires
      - populates_with
      - personalises_via
      COMMUNICATION_TEMPLATE:
      - series_with
      - follows
      - alternative_to
      - replaces
      - related_to
      COMPLIANCE_OBLIGATION:
      - satisfies
      - includes_disclosure_for
      - triggered_by
      CUSTOMER:
      - addressed_to
      - sent_to
      - personalised_for
      ACCOUNT:
      - references
      - confirms
      - alerts_about
      TRANSACTION:
      - triggered_by
      - notifies_about
      - confirms
      CARD:
      - triggered_by_card_event
      - alerts_about
      - confirms_issuance_of
      FRAUD_ALERT:
      - triggered_by
      - notifies_customer_of
      - confirms_action_on
      PRODUCT:
      - promotes
      - confirms_opening_of
      - provides_information_about
    guidance: |-
      Each named communication template captured as a COMMUNICATION_TEMPLATE.
      COMMUNICATION_TEMPLATE names match template headings exactly.
      COMMUNICATION_TEMPLATE entities include trigger_event, channel, variables_used.
      Naming: use the template title from the document. RIGHT:   { "name": "Account Opening Confirmation Email Template" }
  TEMPLATE_VARIABLE:
    kind: recurrent
    description: A named placeholder in a template that is replaced with dynamic data at send time — customer
      name, account number, balance, rate, date, etc. Extract variable names and what data they represent.
      Group closely related variables (e.g., all address fields) into one entity only if the document
      treats them as a unit.
    type_examples:
    - customer_data
    - account_data
    - transaction_data
    - product_data
    - rate_field
    - date_field
    - contact_field
    - amount_field
    - reference_field
    properties:
      variable_placeholder:
        hint: exact placeholder syntax, e.g., "[Customer Name]"
      data_source:
        hint: where the data comes from — CRM | AMS | Product Catalog
      data_type:
        hint: string | currency | date | percentage | account_number
      example_value:
        hint: a sample value if shown
      mandatory:
        hint: yes/no — must always be populated
      appears_in_templates:
        hint: list of template names that use this variable
      character_limit:
        hint: if stated
    relates_to:
      TEMPLATE_VARIABLE:
      - used_together_with
      - part_of_group
    guidance: Each distinct placeholder variable captured as a TEMPLATE_VARIABLE.
  TRAINING_MODULE:
    kind: recurrent
    description: A named, self-contained unit of staff training with defined content, learning objectives,
      and an assessment. Each module covering a distinct topic (AML, KYC, GDPR, Fraud, etc.) is a separate
      entity. Also extract the overall training program as a top-level entity when described as a whole.
    type_examples:
    - aml_module
    - kyc_module
    - gdpr_module
    - fraud_module
    - reporting_module
    - product_module
    - operations_module
    - consequence_module
    - ethics_module
    - security_module
    properties:
      module_number:
        hint: 1, 2, 3, etc.
      module_topic:
        hint: the subject area
      document_id:
        hint: e.g., TRAIN-COMPLIANCE-001
      target_audience:
        hint: all staff | compliance team | branch staff | specific role
      mandatory:
        hint: yes/no
      completion_frequency:
        hint: annual | onboarding | on_change
      pass_threshold:
        hint: assessment pass mark, e.g., "80%+"
      topics_covered:
        hint: list of key topics
      regulatory_basis:
        hint: which regulations this module covers
      certificate_issued:
        hint: yes/no
      duration_estimate:
        hint: if stated
    relates_to:
      LEARNING_OBJECTIVE:
      - teaches
      - assesses
      - enables
      WARNING_SIGN:
      - trains_recognition_of
      - covers
      - tests_knowledge_of
      COMPLIANCE_OBLIGATION:
      - teaches
      - assesses_understanding_of
      - explains
      TRAINING_MODULE:
      - prerequisite_for
      - followed_by
      - related_to
      - part_of_series
      KYC_VERIFICATION:
      - teaches_process_of
      - trains_execution_of
      - assesses_knowledge_of
      AML_SCREENING:
      - teaches_process_of
      - trains_recognition_of_red_flags_in
      - assesses_knowledge_of
      SAR:
      - teaches_filing_of
      - trains_obligation_to_report
      - covers_confidentiality_of
      FRAUD_ALERT:
      - trains_detection_of
      - teaches_response_to
      - covers_escalation_of
      CUSTOMER:
      - teaches_how_to_serve
      - trains_protection_of
      - covers_obligations_toward
      PRODUCT:
      - covers_features_of
      - trains_staff_on
    guidance: |-
      Each training module captured as a TRAINING_MODULE.
      TRAINING_MODULE entities include module_number, mandatory, pass_threshold, regulatory_basis.
      TRAINING_MODULE → TRAINING_MODULE sequence relationships captured.
      Naming: include the module number and topic. RIGHT:   { "name": "Module 1 — AML & Sanctions Compliance" }
  LEARNING_OBJECTIVE:
    kind: recurrent
    description: A specific skill, knowledge item, understanding, or behaviour that staff must demonstrate
      or know after completing a training module. Each distinct stated objective is a separate entity.
      Extract from "by the end of this module you will be able to" or equivalent statements.
    type_examples:
    - regulatory_knowledge
    - process_skill
    - identification_skill
    - reporting_skill
    - product_knowledge
    - ethical_standard
    - decision_skill
    - documentation_skill
    properties:
      module:
        hint: which training module this objective belongs to
      objective_statement:
        hint: what staff will be able to do
      skill_type:
        hint: knowledge | skill | attitude | behaviour
      assessed_in_quiz:
        hint: yes/no
      regulatory_link:
        hint: which regulation this objective helps satisfy
    relates_to:
      WARNING_SIGN:
      - includes_identification_of
      - applied_to_detection_of
      COMPLIANCE_OBLIGATION:
      - covers
      - enables_execution_of
      - tests_understanding_of
    guidance: Learning objectives are extracted from module descriptions -- one per distinct skill/knowledge
      item.
  WARNING_SIGN:
    kind: recurrent
    description: A named red flag, indicator, behavioural pattern, or scenario that staff are trained
      to recognise as suspicious, risky, or requiring action. These are the specific signals staff must
      look for. Each named red flag or indicator is a separate entity.
    type_examples:
    - aml_red_flag
    - fraud_indicator
    - kyc_red_flag
    - sanctions_indicator
    - data_protection_concern
    - misconduct_signal
    - account_takeover_signal
    - social_engineering_attempt
    properties:
      risk_domain:
        hint: aml | fraud | kyc | data_protection | sanctions | misconduct
      description:
        hint: what the warning sign looks like
      examples:
        hint: specific scenarios or patterns given
      required_action:
        hint: what staff must do when they see this
      escalation_path:
        hint: who to report to
      regulatory_obligation:
        hint: is reporting mandatory
      false_positive_guidance:
        hint: how to avoid over-reporting if stated
    relates_to:
      COMPLIANCE_OBLIGATION:
      - triggers
      - leads_to
      - requires
      - creates_duty_to_report
      WARNING_SIGN:
      - co_occurs_with
      - escalates_to
      - related_to
      - pattern_combination_with
      TRANSACTION:
      - identified_in
      - pattern_observed_in
      - triggered_by
      CUSTOMER:
      - exhibited_by
      - associated_with_behaviour_of
      ACCOUNT:
      - observed_on
      - pattern_seen_in
      FRAUD_ALERT:
      - triggers
      - leads_to_generation_of
      AML_SCREENING:
      - triggers_review_in
      - escalates_to
    guidance: |-
      All named red flags and warning signs captured as WARNING_SIGN.
      WARNING_SIGN names are descriptive enough to distinguish from each other.
      WARNING_SIGN entities include risk_domain, required_action, escalation_path.
      Naming: state the red flag descriptively. RIGHT:   { "name": "Large Cash Deposit Followed by Immediate Transfer Out (AML Red Flag)" } WRONG:   { "name": "Red flag 1" }
  COMPLIANCE_OBLIGATION:
    kind: recurrent
    description: A specific compliance requirement, duty, or prohibition explained in training — something
      staff MUST do, MUST NOT do, MUST report, or MUST document. These are the actionable obligations
      extracted from training content, distinct from warning signs (which are inputs) and actions (which
      are responses).
    type_examples:
    - reporting_obligation
    - mandatory_action
    - prohibition
    - escalation_duty
    - documentation_requirement
    - confidentiality_obligation
    - training_completion
    - consent_requirement
    - data_handling_rule
    properties:
      obligation_type:
        hint: mandatory_action | prohibition | reporting_duty | documentation | training
      applies_to:
        hint: which staff roles or all staff
      timeframe:
        hint: when it must be done, e.g., "within 30 days"
      consequence_of_failure:
        hint: stated consequence
      regulatory_source:
        hint: which law or regulator drives this
      verification_method:
        hint: how the bank checks compliance
      exceptions:
        hint: any stated exemptions
    relates_to:
      COMPLIANCE_OBLIGATION:
      - related_to
      - reinforces
      - exception_to
      - preceded_by
      KYC_VERIFICATION:
      - requires_completion_of
      - mandates
      AML_SCREENING:
      - requires_completion_of
      - mandates
      SAR:
      - mandates_filing_of
      - defines_deadline_for
      FRAUD_ALERT:
      - requires_response_to
      - mandates_reporting_of
    guidance: |-
      All explicit compliance duties ("must report", "must not", "must document") captured as COMPLIANCE_OBLIGATION.
      COMPLIANCE_OBLIGATION entities include obligation_type, timeframe, consequence_of_failure.
  PRODUCT:
    kind: recurrent
    description: A banking product referenced in a product training module or customer communication template.
      Extract when the product is the primary subject of training content or the context for a communication
      template.
    type_examples:
    - smartsaver_account
    - current_account
    - mortgage
    - debit_card
    - savings_product
    properties:
      training_module:
        hint: which training module covers this product
      communication_template:
        hint: which templates are associated with this product
      key_features_taught:
        hint: product features covered in training
      customer_facing_messaging:
        hint: tone and key points of customer communications
  ACCOUNT:
    kind: recurrent
    description: A customer account opened, held, modified, or closed under a banking product — savings,
      current, or joint. Extract when the document defines rules, state, or events that apply to the account
      itself.
    type_examples:
    - savings_account
    - current_account
    - joint_account
    - new_account
    - dormant_account
    - frozen_account
    - closed_account
    properties:
      account_type:
        hint: savings | current | joint
      account_state:
        hint: new | active | dormant | frozen | closed
      balance_minimum:
        hint: numeric, no currency symbol or thousands separators, e.g., 500; the
          string "none" if the account has no stated minimum
      balance_maximum:
        hint: numeric, no currency symbol or thousands separators, e.g., 50000; the
          string "unlimited" if the account has no stated maximum
      dormancy_threshold:
        hint: how long with no activity before the account is classified dormant,
          e.g., "12 months"
      closure_or_freeze_conditions: {}
    relates_to:
      ACCOUNT_HOLDER:
      - has_holder
      - held_by
      CARD:
      - linked_to
      - issues
      JOINT_ACCOUNT:
      - classified_as
      - structured_as
      TRANSACTION:
      - records
      - generates
      - has_associated
      KYC_VERIFICATION:
      - gate_for_opening
      - required_before_activating
      AML_SCREENING:
      - required_before_opening
      - ongoing_monitoring_of
      FRAUD_ALERT:
      - raised_on
      - results_in_freeze_of
      STANDING_ORDER:
      - set_up_on
      - deducts_from
      DIRECT_DEBIT:
      - set_up_on
      - deducts_from
  ACCOUNT_HOLDER:
    kind: recurrent
    description: A person with legal rights and obligations over an account — primary, joint, or secondary
      holder — including their liability, authority, and due-diligence obligations.
    type_examples:
    - primary_holder
    - joint_holder
    - secondary_holder
    - beneficial_owner
    - signatory
    properties:
      holder_type:
        hint: primary | joint | secondary
      liability_scope: {}
      withdrawal_or_signing_authority: {}
      due_diligence_requirement: {}
    relates_to:
      JOINT_ACCOUNT:
      - party_to
      - has_rights_in
      - liable_under
  AML_SCREENING:
    kind: recurrent
    description: Anti-Money Laundering screening — sanctions/PEP list checks, transaction monitoring,
      or ongoing screening — as mandated, executed, or reviewed by the document.
    type_examples:
    - sanctions_screening
    - pep_screening
    - transaction_monitoring
    - ongoing_monitoring
    - adverse_media_check
    properties:
      mandatory:
        hint: yes/no
      screening_lists_or_scope: {}
      hit_or_match_response: {}
      regulatory_basis: {}
    relates_to:
      TRANSACTION:
      - monitors
      - screens_for_patterns_in
      SAR:
      - triggers
      - leads_to_filing_of
  CARD:
    kind: recurrent
    description: A payment card issued to, or referenced in connection with, a customer account — its
      issuance, use, blocking, or replacement.
    type_examples:
    - debit_card
    - credit_card
    - prepaid
    - contactless
    - replacement_card
    - card_fraud_scenario
    properties:
      card_type:
        hint: debit | credit | prepaid
      card_state:
        hint: issuance | active | blocked | replacement
      block_or_replacement_conditions: {}
      daily_or_contactless_limit: {}
  CUSTOMER:
    kind: recurrent
    description: A natural person who holds, applies for, or is otherwise the subject of a banking relationship
      — an account, product, transaction, or compliance process. Extract as a first-class entity whenever
      the customer is a defined party in the document, not merely mentioned in passing.
    type_examples:
    - individual_customer
    - joint_account_holder
    - new_customer
    - existing_customer
    - high_risk_customer
    - pep_customer
    - applicant
    - prospective_customer
    properties:
      customer_type:
        hint: individual | joint_applicant | existing | new | high_risk | pep
      risk_classification:
        hint: standard | high_risk | pep | sanctioned
      eligibility_or_verification_status:
        hint: as stated in this document
      context_role:
        hint: how this customer appears in this document
    relates_to:
      ACCOUNT:
      - holds
      - opens
      - closes
      - liable_for
      ACCOUNT_HOLDER:
      - designated_as
      - has_role_as
      AML_SCREENING:
      - screened_by
      - applied_to
      - required_for
      KYC_VERIFICATION:
      - required_to_complete
      - verified_by
      - subject_to
      SAR:
      - filed_about
      - concerns
      JOINT_ACCOUNT:
      - held_jointly_by
      - requires_consent_of_both
      STANDING_ORDER:
      - initiated_by
      - belongs_to
      DIRECT_DEBIT:
      - authorised_by
      - belongs_to
  DIRECT_DEBIT:
    kind: recurrent
    description: A direct debit mandate on a customer account — its setup, the Direct Debit Guarantee,
      amendment, cancellation, or dispute.
    type_examples:
    - dd_mandate_setup
    - dd_guarantee
    - dd_cancellation
    - dd_dispute
    - indemnity_claim
    properties:
      mandate_process: {}
      dd_guarantee_coverage: {}
      cancellation_or_dispute_process: {}
  FRAUD_ALERT:
    kind: recurrent
    description: A fraud detection alert or fraud response — its generation, investigation, escalation,
      or the customer-facing action it triggers.
    type_examples:
    - fraud_detection_obligation
    - card_fraud_event
    - account_takeover
    - fraud_investigation
    - customer_reimbursement
    properties:
      generation_trigger: {}
      investigation_or_escalation_path: {}
      customer_notification: {}
      reimbursement_obligation: {}
    relates_to:
      CARD:
      - raised_for
      - protects
      TRANSACTION:
      - triggered_by
      - raised_on
  JOINT_ACCOUNT:
    kind: recurrent
    description: An account arrangement held jointly by two or more customers with shared rights, liabilities,
      and consent requirements.
    type_examples:
    - joint_and_several
    - tenants_in_common
    - joint_account_arrangement
    properties:
      liability_type:
        hint: joint_and_several | tenants_in_common
      consent_requirements: {}
      dual_kyc_or_aml_requirement: {}
      closure_consent: {}
  KYC_VERIFICATION:
    kind: recurrent
    description: The Know Your Customer identity/address verification process — as a compliance obligation,
      an operational procedure, or an audited control. Extract when the document defines, executes, or
      evaluates KYC requirements.
    type_examples:
    - identity_verification
    - address_verification
    - enhanced_due_diligence
    - periodic_refresh
    - document_collection
    properties:
      mandatory:
        hint: yes/no
      timing_or_refresh_frequency: {}
      verification_method: {}
      consequence_of_failure: {}
    relates_to:
      JOINT_ACCOUNT:
      - required_for_both_holders_of
      - applied_to
  SAR:
    kind: occurrent
    description: A Suspicious Activity Report — the obligation, preparation, filing, or tracking of a
      SAR to the relevant authority (e.g. the NCA).
    type_examples:
    - sar_obligation
    - sar_filing_deadline
    - internal_sar
    - external_sar
    - sar_confidentiality
    properties:
      filing_obligation: {}
      filing_deadline: {}
      confidentiality_rule: {}
      consequence_of_non_filing: {}
    relates_to:
      TRANSACTION:
      - triggered_by
      - based_on_evidence_from
  STANDING_ORDER:
    kind: recurrent
    description: A standing order payment instruction on a customer account — its setup, amendment, cancellation,
      or failure handling.
    type_examples:
    - standing_order_setup
    - standing_order_amendment
    - standing_order_cancellation
    - payment_failure_handling
    properties:
      setup_or_amendment_process: {}
      beneficiary_validation: {}
      cancellation_process: {}
      failure_handling: {}
  TRANSACTION:
    kind: occurrent
    description: A financial event on a customer account — a deposit, withdrawal, transfer, payment, or
      fee charge — referenced because it is monitored, disputed, reported, or otherwise governed by the
      document.
    type_examples:
    - deposit
    - withdrawal
    - transfer
    - fee_charge
    - suspicious_transaction
    - high_value_transaction
    - disputed_transaction
    - monitored_transaction
    properties:
      transaction_type:
        hint: deposit | withdrawal | transfer | fee_charge | suspicious | disputed
      monitoring_or_reporting_obligation: {}
      threshold_value:
        hint: numeric, no currency symbol or thousands separators, e.g., 10000
      dispute_or_reversal_rules: {}
guidance:
  relationships: |-
    All COMMUNICATION_TEMPLATE → TEMPLATE_VARIABLE contains links captured.
    All TRAINING_MODULE → WARNING_SIGN trains_recognition_of links captured.
    All WARNING_SIGN → COMPLIANCE_OBLIGATION trigger chains captured.
    All TRAINING_MODULE → COMPLIANCE_OBLIGATION teaches links captured.
