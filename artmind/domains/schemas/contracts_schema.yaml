name: contracts
description: Commercial and legal contract documents for IT services outsourcing engagements — Master
  Services Agreements/Framework Agreements, Transaction Contracts/Statements of Work, Contract Change
  Notes/Amendments, rate cards, deliverables, milestones, governance structures and charges.
subject: commercial contract analysis
persona: a commercial contracts lawyer reviewing the document
temporal:
  document:
    valid_from:
    - Dated
    - Effective Date
    - Amendment Date
  relative_anchor: document.valid_from
  defaults:
    valid_from: ingestion_date
    valid_to: null
    superseded_by: null
    time_source: default_ingestion
    valid_from_inferred: true
guidance:
  relationships: |-
    AMENDMENT CHAINS: amendments and CCNs form a chronological chain (CCN005 → CCN006 → CCN017 → CCN018, etc). Always capture which prior agreement is being amended, referencing it by its defined name/date even if that prior agreement is not itself in the current text.
    RESPONSIBILITY MATRIX ENTRIES: for PARTY ↔ MILESTONE and PARTY ↔ DELIVERABLE "responsible_for" relationships arising from a Responsibility/RACI matrix, always include properties.task indicating manage, execute, or support.
    SYSTEM VS DELIVERABLE: keep the pre-existing/ongoing SYSTEM distinct from the DELIVERABLE that documents or implements a change to it. Link them with "documented_by" or "implemented_by" rather than treating the system itself as a deliverable.
entity_types:
  AGREEMENT:
    kind: recurrent
    description: Any contractual instrument — the overarching Framework Agreement/MSA, a Transaction Contract
      or Statement of Work made under it, a Contract Change Note or Amendment that varies it, or a named
      Schedule, Appendix, or Rate Card attachment. Include both the agreement currently being read and
      any prior or related agreement it references, amends, or supersedes.
    type_examples:
    - framework_agreement
    - msa
    - transaction_contract
    - statement_of_work
    - contract_change_note
    - amendment
    - schedule
    - appendix
    - rate_card_attachment
    properties:
      document_reference:
        hint: e.g. CCN number, supplier ref, NBS ref
      amends:
        hint: name of the agreement this varies, if any
      status:
        hint: draft | executed | superseded | expired
      governing_law: {}
      effective_date:
        temporal: valid_from
        hint: also signature_date
      term_end_date:
        temporal: valid_to
        hint: or termination_conditions
      total_value:
        hint: if stated
      docusign_envelope_id:
        hint: if given
    relates_to:
      AGREEMENT:
      - amends
      - supersedes
      - replaces
      - incorporates
      - made_under
      - references
      - novates
      PARTY:
      - party_to
      - executed_by
      - governed_by
      - benefits
      - indemnifies
      - terminated_by
      PERSON:
      - signed_by
      - witnessed_by
      CLAUSE:
      - contains
      - amends_clause
      - replaces_clause
      DELIVERABLE:
      - specifies
      - defines_acceptance_criteria_for
      - updates_status_of
      MILESTONE:
      - schedules
      - sets_timeline_for
      - updates_status_of
      FINANCIAL_TERM:
      - sets_out
      - caps
      - replaces_rate_of
  PARTY:
    kind: recurrent
    description: Any organisation that contracts, subcontracts, or is otherwise a legal entity referenced
      in the agreement — the principal contracting parties, approved subcontractors, parent/group companies,
      or regulatory bodies whose powers are referenced (e.g. under the Banking Act). Include registration
      numbers and registered addresses where given.
    type_examples:
    - customer
    - supplier
    - subcontractor
    - parent_company
    - group_member
    - regulatory_body
    - third_party_beneficiary
    properties:
      registration_number: {}
      registered_address: {}
      role_in_contract:
        hint: customer | supplier | subcontractor | parent | regulator
      services_provided:
        hint: for subcontractors
      group_relationship:
        hint: e.g. member of FirstBank Group
    relates_to:
      PARTY:
      - contracts_with
      - subcontracts_to
      - parent_of
      - member_of
      - competitor_of
      - assigns_rights_to
      PERSON:
      - employs
      - represented_by
      - appoints
      - authorises
      DELIVERABLE:
      - delivers
      - accepts
      - owns_ip_in
      - 'responsible_for (properties: {task: manage|execute|support})'
      MILESTONE:
      - 'responsible_for (properties: {task: manage|execute|support})'
      - achieves
      - delays
      CLAUSE:
      - bound_by
      - benefits_from
      - obligated_under
      - waives
      FINANCIAL_TERM:
      - pays
      - receives
      - invoices
      - discounts
      - caps
    guidance: Include registration numbers and registered addresses where given.
  PERSON:
    kind: recurrent
    description: Any named individual referenced in the document — signatories, authorised representatives,
      key/named personnel, or witnesses. Include their title and the party they act for.
    type_examples:
    - signatory
    - authorised_representative
    - key_personnel
    - programme_director
    - programme_manager
    - procurement_manager
    - witness
    properties:
      title_or_role:
        hint: specific to this agreement, e.g. "Senior Buyer", "Programme Director"
      represents:
        hint: which party
      signed_agreement:
        hint: which agreement, and date/time if given
      notice_period:
        hint: for key personnel
      contact_responsibility:
        hint: what they are the point of contact for
    relates_to:
      PERSON:
      - reports_to
      - escalation_contact_for
      - delegate_of
      MILESTONE:
      - responsible_for
      - signs_off_on
      DELIVERABLE:
      - authors
      - approves
      - accepts
    guidance: Include the signatory's or key person's title alongside their name.
  CLAUSE:
    kind: recurrent
    description: A specific numbered clause, sub-clause, or defined contractual provision that establishes
      a right, obligation, condition, or mechanism — termination grounds, assignment, indexation, intellectual
      property, liability, confidentiality, governing law, change control, data protection, force majeure.
      Extract the provision itself, not the surrounding boilerplate housekeeping clauses (counterparts,
      headings) unless they are being specifically amended.
    type_examples:
    - termination
    - assignment
    - indexation
    - intellectual_property
    - liability
    - confidentiality
    - governing_law
    - change_control
    - data_protection
    - force_majeure
    - payment_terms
    - warranty
    - dispute_resolution
    properties:
      clause_number: {}
      obligation_summary:
        hint: what it requires
      trigger_condition:
        hint: what activates it
      amended_by:
        hint: which CCN/amendment changed it, if any
      superseded_text:
        hint: what it replaced, if known
      effective_date:
        hint: when this clause or its amended version takes effect, if stated
        temporal: valid_from
      notice_period:
        hint: if applicable
      cap_or_limit:
        hint: if a financial or liability cap
    relates_to:
      CLAUSE:
      - cross_references
      - overrides
      - defined_in
      FINANCIAL_TERM:
      - caps
      - defines
      - triggers
  DELIVERABLE:
    kind: recurrent
    description: A specific document or non-document work product that the Supplier must produce and the
      Customer must accept — design documents, plans, reports, test artefacts, converted source code,
      runbooks. Include its reference code where one is given (e.g. D001, ND04).
    type_examples:
    - document_deliverable
    - non_document_deliverable
    - design_document
    - test_artefact
    - report
    - runbook
    - source_code
    - release_note
    properties:
      reference_code:
        hint: e.g. D001, ND04
      ip_ownership:
        hint: e.g. "Type III Materials"
      status:
        hint: delivered | future | delivered_by_customer | in_progress
      responsible_party: {}
      associated_workstream: {}
      acceptance_period:
        hint: or rectification_period
    relates_to:
      MILESTONE:
      - due_at
      - delivered_at
      - associated_with
    guidance: Preserve reference codes exactly as given (e.g. D001, ND04).
  MILESTONE:
    kind: recurrent
    description: A significant temporal checkpoint or phase in the programme timeline — a numbered programme
      milestone, a workstream phase, or a named programme event such as Cutover, Dress Rehearsal, Go-Live,
      or Hypercare. Include both delivered/achieved and future/planned milestones.
    type_examples:
    - programme_milestone
    - workstream_phase
    - cutover_event
    - dress_rehearsal
    - go_live
    - hypercare_period
    - acceptance_event
    properties:
      reference_code:
        hint: e.g. M01, M13
      status:
        hint: delivered | future | at_risk | achieved
      workstream:
        hint: which programme workstream it belongs to
      dependencies: {}
      target_date:
        temporal: valid_from
        hint: or timeframe
    guidance: Preserve reference codes exactly as given (e.g. M01, M13).
  FINANCIAL_TERM:
    kind: recurrent
    description: Any commercial or financial term — a charge, rate, discount, indexation provision, cap,
      recoverable expense, liquidated damages provision, or payment term. Extract the figure or mechanism
      together with what it applies to.
    type_examples:
    - charge
    - rate_card_entry
    - discount
    - indexation_cap
    - recoverable_expense
    - liquidated_damages
    - payment_term
    - volume_discount
    - invoice_term
    guidance: |-
      RATE/CHARGES TABLES: if the text contains a markdown table listing individual roles or line items with a rate, charge, or price column, extract EVERY data row as its own FINANCIAL_TERM entity of type rate_card_entry -- do not collapse the table into one summary entity, and do not skip rows because the table is long. Name each entity after the role/item the row describes, never after the numeric value alone. When enriching properties for such a row, also capture its other columns using the table's own column names (e.g. "workstream", "role", "estimated_days", "estimated_charges") -- column names vary by document, but role and rate are present in nearly every rate table.
      Every row of every rate/charges table extracted as its own FINANCIAL_TERM entity — none collapsed or skipped.
    properties:
      amount_or_rate: {}
      currency: {}
      applies_to:
        hint: what charge/party/period this covers
      cap_or_limit: {}
      effective_date:
        temporal: valid_from
      vat_treatment:
        hint: excl./incl. VAT
      calculation_method:
        hint: if a formula is given
    relates_to:
      MILESTONE:
      - applies_from
      - triggered_at
  SYSTEM:
    kind: recurrent
    description: 'A named technology system, application, interface, tool, or platform referenced in the
      contract''s technical scope — a legacy application being converted, a target application being built
      or integrated with, a batch scheduler, a database platform, or a conversion/runtime tooling asset.
      Distinct from DELIVERABLE: a SYSTEM is the pre-existing or ongoing technical component itself (e.g.
      "NOVA", "ORION", "APEX", "PRISM", "LYNX"), not the document/artefact that describes or implements
      a change to it.'
    type_examples:
    - legacy_application
    - target_application
    - integration_interface
    - batch_system
    - database_platform
    - conversion_tool
    - runtime_asset
    - development_environment
    properties:
      system_type:
        hint: legacy | target | integration | tooling
      owner_or_operator:
        hint: which party owns or operates it
      role_in_programme:
        hint: source | target | integration_point | tooling
      replaces_or_replaced_by:
        hint: the corresponding legacy/target system, if a conversion pair
      current_status:
        hint: in_use | being_converted | being_replaced | decommissioned
      hosting_environment:
        hint: which party's environment it runs in
      conversion_date:
        hint: when it was or will be converted/cut over, if stated
        temporal: valid_from
    relates_to:
      SYSTEM:
      - replaces
      - integrates_with
      - converted_to
      - feeds_into
      - depends_on
      PARTY:
      - owned_by
      - operated_by
      - supported_by
      DELIVERABLE:
      - documented_by
      - implemented_by
      - converted_via
      MILESTONE:
      - converted_at
      - deployed_at
      - decommissioned_at
      AGREEMENT:
      - in_scope_of
