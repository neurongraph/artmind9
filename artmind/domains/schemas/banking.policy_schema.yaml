name: banking.policy
description: Formal policy documents for FirstUK Bank covering AML/CFT, customer identification (KYC),
  fraud prevention, information security, privacy (GDPR), complaints handling, operational risk, and data
  retention — establishing mandatory obligations, controls, regulatory references, and accountability.
subject: banking policy document analysis
persona: a compliance officer
temporal:
  document:
    valid_from:
    - Effective Date
    - effective_date
    version:
    - Version
  relative_anchor: document.valid_from
  defaults:
    valid_from: ingestion_date
    valid_to: null
    superseded_by: null
    time_source: default_ingestion
    valid_from_inferred: true
    supersede_on_title_family: true
entity_types:
  POLICY:
    kind: recurrent
    description: A named formal policy document — the policy itself as a governing instrument, with its
      scope, owner, regulatory basis, and version. Each distinct policy document is one POLICY entity.
      Also extract policy-level principles or statements that define the bank's stance on a domain.
    type_examples:
    - aml_policy
    - kyc_policy
    - fraud_policy
    - information_security
    - privacy
    - complaints
    - operational_risk
    - data_retention
    - credit_risk
    - conduct
    properties:
      document_id:
        hint: e.g., AML-POL-002
      policy_domain:
        hint: aml | fraud | privacy | etc.
      owner:
        hint: role responsible for the policy
      owning_department:
        hint: department
      effective_date:
        temporal: valid_from
      review_date:
        hint: next scheduled review
      audience:
        hint: who must comply
      regulatory_basis:
        hint: list of underpinning regulations
      scope_summary:
        hint: what it applies to and what is excluded
      core_policy_statement:
        hint: the key stance or commitment
      version: {}
    relates_to:
      REGULATORY_REFERENCE:
      - mandated_by
      - implements
      - complies_with
      - derived_from
      - references
      - supersedes_prior_guidance
      POLICY_PROVISION:
      - contains
      - establishes
      - mandates
      - prohibits
      - reviews
      RISK_CATEGORY:
      - addresses
      - mitigates
      - governs_response_to
      - scoped_to
      CONTROL_MEASURE:
      - requires
      - mandates
      - references
      - delegates_to_sop
      ROLE_RESPONSIBILITY:
      - assigns_responsibility_to
      - owned_by
      - approved_by
      - applies_to
      CUSTOMER:
      - governs_treatment_of
      - assigns_obligations_toward
      - protects
      ACCOUNT:
      - governs_opening_of
      - mandates_controls_on
      - governs_closure_of
      TRANSACTION:
      - mandates_monitoring_of
      - requires_reporting_of
      - governs
      PRODUCT:
      - applies_to
      - governs_risk_of
      KYC_VERIFICATION:
      - mandates
      - defines_requirements_for
      - governs
      AML_SCREENING:
      - mandates
      - defines_requirements_for
      - governs
      SAR:
      - mandates_filing_of
      - defines_obligations_for
      FRAUD_ALERT:
      - mandates_generation_of
      - defines_response_to
    guidance: |-
      The policy itself captured as a POLICY entity.
      POLICY entities include document_id, regulatory_basis, core_policy_statement.
      Direction is correct (POLICY mandated_by REGULATION, not reverse).
  POLICY_PROVISION:
    kind: recurrent
    description: A specific rule, requirement, obligation, prohibition, or standard stated within a policy.
      Extract provisions that represent discrete, actionable mandates — things that staff must do, must
      not do, or must ensure. Each distinct provision is a separate entity. Do not collapse a set of requirements
      into one vague provision.
    type_examples:
    - mandatory_requirement
    - prohibition
    - obligation
    - reporting_obligation
    - record_retention_rule
    - training_requirement
    - review_schedule
    - notification_rule
    - response_timeframe
    - approval_requirement
    properties:
      provision_type:
        hint: mandatory | prohibited | conditional | periodic
      applies_to:
        hint: roles, channels, products, or customer types it applies to
      timeframe:
        hint: any deadline, frequency, or retention period stated
      consequence_of_breach:
        hint: what happens if not met
      verification_method:
        hint: how compliance is checked
      regulatory_source:
        hint: the regulation requiring this provision
      exceptions:
        hint: any stated exceptions or waiver process
      linked_control:
        hint: which control measure implements this
    relates_to:
      REGULATORY_REFERENCE:
      - implements
      - derived_from
      - satisfies
      RISK_CATEGORY:
      - addresses
      - triggered_by
      - targets
      CONTROL_MEASURE:
      - implemented_by
      - enforced_through
      - requires
      ROLE_RESPONSIBILITY:
      - applies_to
      - enforced_by
      - reported_to
      POLICY_PROVISION:
      - exception_to
      - overrides
      - related_to
      - strengthened_by
      CUSTOMER:
      - applies_to
      - governs_treatment_of
      - protects
      ACCOUNT:
      - applies_to
      - mandates_control_on
      TRANSACTION:
      - governs
      - requires_monitoring_of
      - triggers_reporting_for
      KYC_VERIFICATION:
      - implements
      - mandates
      - defines_requirement_for
      AML_SCREENING:
      - implements
      - mandates
      - defines_requirement_for
      SAR:
      - mandates_filing_of
      - defines_deadline_for
      FRAUD_ALERT:
      - mandates_response_to
      - defines_reimbursement_for
      IDENTIFICATION_DOCUMENT:
      - specifies_acceptable
      - mandates_retention_of
      ACCOUNT_HOLDER:
      - applies_to
      - defines_obligations_for
      JOINT_ACCOUNT:
      - governs
      - applies_to
      - defines_due_diligence_for
    guidance: |-
      Each distinct mandatory requirement extracted as a POLICY_PROVISION.
      POLICY_PROVISION names are descriptive (not just section numbers).
      POLICY_PROVISION entities include provision_type, applies_to, consequence_of_breach.
      Naming: name it by what it requires, not just "Section 3.1". RIGHT:   { "name": "Mandatory AML Screening at Account Opening" } WRONG:   { "name": "Section 3.1 — Core Requirements" }
  REGULATORY_REFERENCE:
    kind: recurrent
    description: A law, regulation, regulatory directive, external standard, sanctions list, or guidance
      document that the policy must comply with or is derived from. Include both the formal document name
      and the issuing authority when both are stated. Each distinct regulation is a separate entity.
    type_examples:
    - legislation
    - regulation
    - regulatory_guidance
    - international_standard
    - sanctions_list
    - industry_code
    - directive
    - rulebook
    properties:
      issuing_authority:
        hint: FCA, PRA, HMRC, EU Commission, etc.
      jurisdiction:
        hint: UK | EU | international
      regulation_type:
        hint: primary_legislation | secondary_legislation | regulatory_guidance | industry_standard |
          sanctions_list
      key_obligation:
        hint: the core obligation it imposes on the bank
      effective_date:
        hint: when it came into force
        temporal: valid_from
      how_cited:
        hint: how this document references it
      consequences_of_breach:
        hint: regulatory penalties or enforcement actions
    relates_to:
      RISK_CATEGORY:
      - addresses
      - regulates
      - defines_response_to
      CONTROL_MEASURE:
      - mandates
      - specifies
      - requires
      ROLE_RESPONSIBILITY:
      - imposes_obligation_on
      - designates
    guidance: |-
      All named regulations, laws, and directives captured as REGULATORY_REFERENCE.
      REGULATORY_REFERENCE uses full formal names.
      REGULATORY_REFERENCE entities include issuing_authority, jurisdiction, key_obligation.
  RISK_CATEGORY:
    kind: recurrent
    description: A named type of risk, threat, or financial crime scenario that the policy is designed
      to address or mitigate. Capture how the policy defines or characterises each risk type.
    type_examples:
    - money_laundering
    - terrorist_financing
    - sanctions_violation
    - fraud
    - data_breach
    - operational_risk
    - credit_risk
    - reputational_risk
    - information_security_risk
    - compliance_risk
    - unauthorized_access
    properties:
      risk_definition:
        hint: how the policy defines this risk
      examples:
        hint: specific scenarios or patterns cited
      detection_mechanism:
        hint: how the bank detects this risk
      risk_level:
        hint: low | medium | high | critical
      required_response:
        hint: what the policy requires when this risk is identified
      reporting_obligation:
        hint: who must be notified
    relates_to:
      CONTROL_MEASURE:
      - mitigated_by
      - detected_by
      - prevented_by
      - responded_to_by
      RISK_CATEGORY:
      - related_to
      - escalates_to
      - co_occurs_with
    guidance: Each type of risk or financial crime the policy addresses captured as RISK_CATEGORY.
  CONTROL_MEASURE:
    kind: recurrent
    description: 'A specific operational safeguard, monitoring mechanism, or protective tool required
      by the policy — the "how" through which compliance obligations are implemented. Note: KYC_VERIFICATION
      and AML_SCREENING are first-class entities covering those processes; use CONTROL_MEASURE for the
      operational mechanisms and technical tools that implement them (e.g., transaction monitoring systems,
      access controls, encryption, dual authorisation gates).'
    type_examples:
    - transaction_monitoring
    - access_control
    - authentication
    - record_keeping
    - staff_training
    - audit_logging
    - incident_reporting
    - approval_gate
    - data_encryption
    - penetration_testing
    - dual_authorisation
    - data_masking
    properties:
      control_type:
        hint: preventive | detective | corrective | directive
      mandatory:
        hint: yes/no
      frequency:
        hint: real-time | daily | monthly | annual | at_onboarding | periodic
      performed_by:
        hint: role or system
      applies_to:
        hint: which risks or processes it addresses
      evidence_required:
        hint: what records must be kept
      escalation_path:
        hint: what happens if control fails or flags a hit
      technology_used:
        hint: system or tool if mentioned
    relates_to:
      ROLE_RESPONSIBILITY:
      - performed_by
      - reviewed_by
      - escalated_to
      - owned_by
      CONTROL_MEASURE:
      - precedes
      - triggered_by
      - complements
      - replaced_by
    guidance: |-
      All named controls, screening mechanisms, and safeguards captured as CONTROL_MEASURE.
      CONTROL_MEASURE entities include control_type, frequency, performed_by.
  ROLE_RESPONSIBILITY:
    kind: recurrent
    description: 'An abstract role, committee, or staff collective with explicitly defined accountability,
      obligations, or authority under this policy. Extract the role title and the specific responsibilities
      assigned to it. Note: named individual employees (e.g., "Head of Financial Crime") are extracted
      as EMPLOYEE entities. Named organisational departments (e.g., "Financial Crime Department") are
      extracted as DEPARTMENT entities. Use ROLE_RESPONSIBILITY for abstract roles (MLRO, Data Protection
      Officer), staff collectives (all staff, customer-facing staff), regulatory bodies, and cross-functional
      committees.'
    type_examples:
    - policy_owner
    - mlro
    - data_protection_officer
    - all_staff
    - board_committee
    - risk_committee
    - external_regulator
    - third_party_processor
    - data_subject
    properties:
      role_title:
        hint: exact role as stated
      department:
        hint: which department this role sits in
      specific_obligations:
        hint: list of what they must do under this policy
      authority:
        hint: decisions they can make
      accountability_for:
        hint: what they are held responsible for
      reporting_to:
        hint: who they report to under this policy
      training_required:
        hint: any stated training obligations
    relates_to:
      ROLE_RESPONSIBILITY:
      - reports_to
      - escalates_to
      - oversees
      - advises
    guidance: |-
      All named roles with defined responsibilities captured as ROLE_RESPONSIBILITY.
      All ROLE_RESPONSIBILITY accountability chains captured.
  PRODUCT:
    kind: recurrent
    description: A banking product referenced as being subject to policy requirements — AML obligations,
      KYC requirements, or fraud controls that apply to specific products.
    type_examples:
    - savings_account_product
    - current_account_product
    - joint_account_product
    - card_product
    properties:
      applicable_policy:
        hint: which policy or obligation applies to this product
      kyc_requirement:
        hint: whether KYC is mandatory for this product
      aml_requirement:
        hint: AML screening obligation for this product
      risk_classification:
        hint: product's risk level under the policy
  IDENTIFICATION_DOCUMENT:
    kind: recurrent
    description: An official identity document required by policy for KYC purposes — the types accepted,
      validity requirements, and verification obligations. Extract when the policy specifies acceptable
      document types or document-handling obligations.
    type_examples:
    - passport
    - driving_licence
    - national_id
    - proof_of_address
    - utility_bill
    - document_retention
    properties:
      accepted_types:
        hint: list of documents the policy accepts for KYC
      validity_requirements:
        hint: expiry, condition, issuing country
      verification_method:
        hint: physical inspection, digital check, database
      retention_period:
        hint: how long the document or record must be kept
      exception_handling:
        hint: what to do if a customer cannot provide standard documents
    relates_to:
      CUSTOMER:
      - proves_identity_of
      - belongs_to
  ACCOUNT:
    kind: recurrent
    description: A customer account opened, held, modified, or closed under a banking product — savings,
      current, or joint. Extract when the document defines rules, state, or events that apply to the account
      itself.
    type_examples:
    - savings_account
    - current_account
    - joint_account
    - new_account
    - dormant_account
    - frozen_account
    - closed_account
    properties:
      account_type:
        hint: savings | current | joint
      account_state:
        hint: new | active | dormant | frozen | closed
      balance_minimum:
        hint: numeric, no currency symbol or thousands separators, e.g., 500; the
          string "none" if the account has no stated minimum
      balance_maximum:
        hint: numeric, no currency symbol or thousands separators, e.g., 50000; the
          string "unlimited" if the account has no stated maximum
      dormancy_threshold:
        hint: how long with no activity before the account is classified dormant,
          e.g., "12 months"
      closure_or_freeze_conditions: {}
    relates_to:
      ACCOUNT_HOLDER:
      - has_holder
      - held_by
      CARD:
      - linked_to
      - issues
      JOINT_ACCOUNT:
      - classified_as
      - structured_as
      TRANSACTION:
      - records
      - generates
      - has_associated
      KYC_VERIFICATION:
      - gate_for_opening
      - required_before_activating
      AML_SCREENING:
      - required_before_opening
      - ongoing_monitoring_of
      FRAUD_ALERT:
      - raised_on
      - results_in_freeze_of
      STANDING_ORDER:
      - set_up_on
      - deducts_from
      DIRECT_DEBIT:
      - set_up_on
      - deducts_from
  ACCOUNT_HOLDER:
    kind: recurrent
    description: A person with legal rights and obligations over an account — primary, joint, or secondary
      holder — including their liability, authority, and due-diligence obligations.
    type_examples:
    - primary_holder
    - joint_holder
    - secondary_holder
    - beneficial_owner
    - signatory
    properties:
      holder_type:
        hint: primary | joint | secondary
      liability_scope: {}
      withdrawal_or_signing_authority: {}
      due_diligence_requirement: {}
    relates_to:
      JOINT_ACCOUNT:
      - party_to
      - has_rights_in
      - liable_under
  AML_SCREENING:
    kind: recurrent
    description: Anti-Money Laundering screening — sanctions/PEP list checks, transaction monitoring,
      or ongoing screening — as mandated, executed, or reviewed by the document.
    type_examples:
    - sanctions_screening
    - pep_screening
    - transaction_monitoring
    - ongoing_monitoring
    - adverse_media_check
    properties:
      mandatory:
        hint: yes/no
      screening_lists_or_scope: {}
      hit_or_match_response: {}
      regulatory_basis: {}
    relates_to:
      TRANSACTION:
      - monitors
      - screens_for_patterns_in
      SAR:
      - triggers
      - leads_to_filing_of
  CARD:
    kind: recurrent
    description: A payment card issued to, or referenced in connection with, a customer account — its
      issuance, use, blocking, or replacement.
    type_examples:
    - debit_card
    - credit_card
    - prepaid
    - contactless
    - replacement_card
    - card_fraud_scenario
    properties:
      card_type:
        hint: debit | credit | prepaid
      card_state:
        hint: issuance | active | blocked | replacement
      block_or_replacement_conditions: {}
      daily_or_contactless_limit: {}
  CUSTOMER:
    kind: recurrent
    description: A natural person who holds, applies for, or is otherwise the subject of a banking relationship
      — an account, product, transaction, or compliance process. Extract as a first-class entity whenever
      the customer is a defined party in the document, not merely mentioned in passing.
    type_examples:
    - individual_customer
    - joint_account_holder
    - new_customer
    - existing_customer
    - high_risk_customer
    - pep_customer
    - applicant
    - prospective_customer
    properties:
      customer_type:
        hint: individual | joint_applicant | existing | new | high_risk | pep
      risk_classification:
        hint: standard | high_risk | pep | sanctioned
      eligibility_or_verification_status:
        hint: as stated in this document
      context_role:
        hint: how this customer appears in this document
    relates_to:
      ACCOUNT:
      - holds
      - opens
      - closes
      - liable_for
      ACCOUNT_HOLDER:
      - designated_as
      - has_role_as
      AML_SCREENING:
      - screened_by
      - applied_to
      - required_for
      KYC_VERIFICATION:
      - required_to_complete
      - verified_by
      - subject_to
      SAR:
      - filed_about
      - concerns
      JOINT_ACCOUNT:
      - held_jointly_by
      - requires_consent_of_both
      STANDING_ORDER:
      - initiated_by
      - belongs_to
      DIRECT_DEBIT:
      - authorised_by
      - belongs_to
  DIRECT_DEBIT:
    kind: recurrent
    description: A direct debit mandate on a customer account — its setup, the Direct Debit Guarantee,
      amendment, cancellation, or dispute.
    type_examples:
    - dd_mandate_setup
    - dd_guarantee
    - dd_cancellation
    - dd_dispute
    - indemnity_claim
    properties:
      mandate_process: {}
      dd_guarantee_coverage: {}
      cancellation_or_dispute_process: {}
  FRAUD_ALERT:
    kind: recurrent
    description: A fraud detection alert or fraud response — its generation, investigation, escalation,
      or the customer-facing action it triggers.
    type_examples:
    - fraud_detection_obligation
    - card_fraud_event
    - account_takeover
    - fraud_investigation
    - customer_reimbursement
    properties:
      generation_trigger: {}
      investigation_or_escalation_path: {}
      customer_notification: {}
      reimbursement_obligation: {}
    relates_to:
      CARD:
      - raised_for
      - protects
      TRANSACTION:
      - triggered_by
      - raised_on
  JOINT_ACCOUNT:
    kind: recurrent
    description: An account arrangement held jointly by two or more customers with shared rights, liabilities,
      and consent requirements.
    type_examples:
    - joint_and_several
    - tenants_in_common
    - joint_account_arrangement
    properties:
      liability_type:
        hint: joint_and_several | tenants_in_common
      consent_requirements: {}
      dual_kyc_or_aml_requirement: {}
      closure_consent: {}
  KYC_VERIFICATION:
    kind: recurrent
    description: The Know Your Customer identity/address verification process — as a compliance obligation,
      an operational procedure, or an audited control. Extract when the document defines, executes, or
      evaluates KYC requirements.
    type_examples:
    - identity_verification
    - address_verification
    - enhanced_due_diligence
    - periodic_refresh
    - document_collection
    properties:
      mandatory:
        hint: yes/no
      timing_or_refresh_frequency: {}
      verification_method: {}
      consequence_of_failure: {}
    relates_to:
      IDENTIFICATION_DOCUMENT:
      - requires
      - verified_using
      - relies_on
      JOINT_ACCOUNT:
      - required_for_both_holders_of
      - applied_to
  SAR:
    kind: occurrent
    description: A Suspicious Activity Report — the obligation, preparation, filing, or tracking of a
      SAR to the relevant authority (e.g. the NCA).
    type_examples:
    - sar_obligation
    - sar_filing_deadline
    - internal_sar
    - external_sar
    - sar_confidentiality
    properties:
      filing_obligation: {}
      filing_deadline: {}
      confidentiality_rule: {}
      consequence_of_non_filing: {}
    relates_to:
      ROLE_RESPONSIBILITY:
      - filed_by
      - reviewed_by
      TRANSACTION:
      - triggered_by
      - based_on_evidence_from
  STANDING_ORDER:
    kind: recurrent
    description: A standing order payment instruction on a customer account — its setup, amendment, cancellation,
      or failure handling.
    type_examples:
    - standing_order_setup
    - standing_order_amendment
    - standing_order_cancellation
    - payment_failure_handling
    properties:
      setup_or_amendment_process: {}
      beneficiary_validation: {}
      cancellation_process: {}
      failure_handling: {}
  TRANSACTION:
    kind: occurrent
    description: A financial event on a customer account — a deposit, withdrawal, transfer, payment, or
      fee charge — referenced because it is monitored, disputed, reported, or otherwise governed by the
      document.
    type_examples:
    - deposit
    - withdrawal
    - transfer
    - fee_charge
    - suspicious_transaction
    - high_value_transaction
    - disputed_transaction
    - monitored_transaction
    properties:
      transaction_type:
        hint: deposit | withdrawal | transfer | fee_charge | suspicious | disputed
      monitoring_or_reporting_obligation: {}
      threshold_value:
        hint: numeric, no currency symbol or thousands separators, e.g., 10000
      dispute_or_reversal_rules: {}
guidance:
  relationships: |-
    All POLICY → REGULATORY_REFERENCE mandated_by links captured.
    All POLICY → RISK_CATEGORY addresses links captured.
    All POLICY_PROVISION → CONTROL_MEASURE implementation links captured.
    All RISK_CATEGORY → CONTROL_MEASURE mitigation links captured.
